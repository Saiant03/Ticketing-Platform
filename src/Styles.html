<style>
  *,*::before,*::after{box-sizing:border-box}
  html{height:100%;background:var(--space-0);overflow-x:clip}
  body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);
    font:400 var(--fs-md)/1.45 var(--font);-webkit-font-smoothing:antialiased;
    /* strălucirea nebuloasei, centrată pe nucleul hărții (--gx/--gy vin din JS) */
    background:radial-gradient(ellipse 700px 600px at var(--gx,50vw) var(--gy,45vh),color-mix(in srgb,var(--nebula) 40%,transparent) 0%,color-mix(in srgb,var(--nebula) 26%,transparent) 45%,transparent 100%),var(--space-0)}
  ::selection{background:var(--acc);color:var(--on-acc)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  [hidden]{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke-linecap:round;stroke-linejoin:round}
  button{font:inherit;color:inherit}
  h1,h2,h3,p,dl,dd,ol{margin:0}
  input,textarea{caret-color:var(--acc)}
  *{scrollbar-width:thin;scrollbar-color:var(--glass-line) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--glass-line);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  #stars{position:fixed;z-index:0;pointer-events:none;will-change:transform,opacity}
  .shoot{position:fixed;left:-110px;top:0;z-index:0;width:110px;height:1.2px;opacity:0;pointer-events:none;transform-origin:100% 50%;background:linear-gradient(90deg,transparent,var(--ink));will-change:transform,opacity}
  .skip{position:fixed;left:var(--sp-3);top:var(--sp-3);z-index:100;background:var(--acc);color:var(--on-acc);font-weight:600;
    padding:var(--sp-2) var(--sp-3);border-radius:var(--r-pill);transform:translateY(-200%)}
  .skip:focus{transform:none}
  .mono{font-family:var(--mono)}

  /* ---------- controale ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:38px;padding:0 18px;border:1px solid transparent;
    border-radius:var(--r-pill);background:none;cursor:pointer;font-weight:500;font-size:var(--fs-sm);white-space:nowrap;
    transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease)}
  .btn:active:not(:disabled){transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{height:34px;padding:0 14px}
  .btn .ar{transition:transform .25s var(--ease)}
  .btn:hover:not(:disabled) .ar{transform:translateX(3px)}
  .btn-solid{background:var(--acc);color:var(--on-acc)}
  .btn-solid:hover:not(:disabled){background:var(--acc-h)}
  .btn-ghost{border-color:var(--ink-3);color:var(--ink)}
  .btn-ghost:hover:not(:disabled){background:var(--glass-2)}
  .btn-danger{background:var(--danger);color:var(--on-acc)}
  .btn-danger-ghost{border-color:var(--ink-3);color:var(--danger)}
  .btn-danger-ghost:hover{border-color:var(--danger);background:var(--danger-soft)}
  .btn-circle{position:relative;width:40px;height:40px;flex:none;display:inline-grid;place-items:center;padding:0;border-radius:50%;cursor:pointer;
    border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
    transition:background-color var(--t-fast),border-color var(--t-fast)}
  .btn-circle:hover{background:var(--glass-2)}
  .btn-circle.sm{width:34px;height:34px}
  .btn.busy{position:relative;color:transparent !important}
  .btn.busy::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--on-acc);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .input,.select,.textarea{width:100%;height:42px;padding:0 14px;border:1px solid var(--ink-3);border-radius:var(--r-sm);
    background:var(--glass);color:var(--ink);font:inherit;font-size:var(--fs-md);transition:border-color var(--t-fast),box-shadow var(--t-fast),background-color var(--t-fast)}
  .textarea{height:auto;min-height:104px;padding:10px 14px;resize:vertical;line-height:1.55}
  .select{appearance:none;padding-right:34px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
  .select option{background:var(--space-0);color:var(--ink)}
  .input::placeholder,.textarea::placeholder{color:var(--ink-3);opacity:1}
  .input:hover,.select:hover,.textarea:hover{background-color:var(--glass-2)}
  .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
  .lbl{display:block;font-size:var(--fs-sm);font-weight:500;color:var(--ink);margin-bottom:6px}
  .lbl .opt{font-weight:400;color:var(--ink-3)}
  .hint{font-size:var(--fs-xs);color:var(--ink-3)}
  .field{margin-bottom:var(--sp-5)}
  .field-err{font-size:var(--fs-sm);font-weight:500;color:var(--danger);margin-top:6px}
  .row-end{display:flex;justify-content:flex-end;gap:var(--sp-2)}
  kbd{font:500 11px/1 var(--mono);border:1px solid var(--ink-3);padding:3px 6px;border-radius:6px;color:var(--ink-2)}
  .linkish{display:inline-flex;align-items:center;min-height:32px;border:0;background:none;padding:0 4px;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

  /* pill-uri: grup segmentat și alegeri (zonă, prioritate, tip) */
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--glass-line);flex:none}
  .seg button,.pills button{height:32px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-pill);background:none;cursor:pointer;color:var(--ink-2);
    font-weight:500;font-size:var(--fs-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background-color var(--t-fast),color var(--t-fast),border-color var(--t-fast)}
  .seg button:hover,.pills button:hover{color:var(--ink);background:var(--glass-2)}
  .seg button[aria-pressed="true"],.seg button[aria-checked="true"],.pills button[aria-checked="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent);color:var(--ink)}
  .seg .n{font:500 11px var(--mono)}
  .pills{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
  .pills button{height:34px;border-color:var(--glass-line);background:var(--glass)}
  .pills button[aria-checked="true"]{border-color:var(--acc)}

  .chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-pill);border:1px solid var(--glass-line);font-weight:500;font-size:var(--fs-xs);color:var(--ink);white-space:nowrap}
  .chip.crit{border-color:var(--st-crit);color:var(--danger)}
  .chip[data-st]::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--st-open)}
  .chip[data-st="in_lucru"]::before{background:var(--st-work);box-shadow:0 0 7px var(--st-work)}
  .chip[data-st="rezolvat"]::before{background:none;border:1.5px solid var(--st-done)}

  /* ---------- bara de sus ---------- */
  .bar{flex:none;position:relative;z-index:40;height:var(--bar-h);display:flex;align-items:center;gap:var(--sp-3);padding:0 32px}
  .brand{font-weight:500;font-size:20px;line-height:1;letter-spacing:-.01em;white-space:nowrap;flex:none}
  .brand i{font-style:normal;color:var(--acc)}
  .tabs{display:flex;gap:6px;margin-left:var(--sp-5)}
  .tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;background:none;border-radius:var(--r-pill);cursor:pointer;
    color:var(--ink-2);font-weight:500;font-size:var(--fs-md);transition:color var(--t-fast),background-color var(--t-fast)}
  .tab:hover{color:var(--ink);background:var(--glass)}
  .tab[aria-current="page"]{color:var(--ink)}
  .tab[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .bar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .search{position:relative;width:230px;display:block}
  .search .input{height:38px;padding:0 34px 0 16px;border-radius:var(--r-pill);font-size:var(--fs-sm);-webkit-appearance:none;appearance:none}
  .search .input::-webkit-search-cancel-button{-webkit-appearance:none}
  .search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search .input:focus ~ kbd{display:none}
  .admin-wrap{position:relative}
  .admin-wrap .dot{display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .admin-on .admin-wrap .dot{display:block}
  .pop{position:absolute;right:0;top:calc(100% + 10px);width:290px;padding:var(--sp-4);background:var(--glass-dark);color:var(--ink);
    border:1px solid var(--glass-line);border-radius:var(--r-card);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow-card);z-index:60}
  .pop .input{margin-bottom:var(--sp-3)}
  .who-admin{margin-bottom:var(--sp-3);font-size:var(--fs-sm);color:var(--ink-2)}
  .who-admin b{color:var(--ink);font-weight:500}

  /* ---------- pagina Tichete ---------- */
  main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
  main:focus{outline:none}
  .page{flex:1;min-height:0}
  #page-tichete{display:flex;flex-direction:column}
  .filters{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);padding:6px 32px 0;transition:max-width var(--t-card) var(--ease)}
  .filters .select{height:38px;width:auto;min-width:150px;border-radius:var(--r-pill);font-size:var(--fs-sm);border-color:var(--glass-line);padding-left:16px}
  .filters .seg button{height:32px}
  .sel-wrap{display:inline-flex}
  .list-only{display:none}
  [data-view="list"] .list-only{display:inline-flex}
  .list-meta{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font:400 12px var(--mono);color:var(--ink-3);padding-left:var(--sp-2)}
  body.card-open .filters{max-width:calc(100% - 448px)}
  [data-page="news"] .search,[data-page="jurnal"] .search{display:none}

  .stage{flex:1;min-height:0;position:relative}
  #map{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ring{fill:none;stroke:var(--ring);stroke-width:1;transition:stroke var(--t-card),opacity var(--t-card)}
  .ring.dash{stroke-dasharray:2 7}
  .ring.on{stroke:color-mix(in srgb,var(--acc) 40%,transparent)}
  .ring.faded{opacity:.4}
  .core-t{font:500 11px var(--mono);letter-spacing:.12em;fill:var(--nebula)}
  .rz{cursor:pointer;outline:none}
  .rz text{font:400 11px var(--mono);letter-spacing:.2em;fill:var(--ink-3);transition:fill var(--t-fast)}
  .rz:hover text{fill:var(--ink)}
  .rz.on text{fill:var(--acc-h)}
  .rp{fill:none;stroke:none}
  .rzh{fill:none;stroke:transparent;stroke-width:24;pointer-events:stroke}
  .rz:focus-visible .rzh{stroke:var(--acc);stroke-opacity:.3}
  .rz:focus-visible text{fill:var(--ink)}

  .planet{cursor:pointer;outline:none;transition:opacity var(--t-card)}
  .planet.fresh,.planet.gone,.lbl.gone{opacity:0}
  .planet .body{transform-box:fill-box;transform-origin:center;transition:r var(--t-card) var(--ease),fill var(--t-card),stroke var(--t-card),transform var(--t-fast) var(--ease)}
  .planet.st-deschis .body{fill:var(--st-open)}
  .planet.st-in_lucru .body{fill:var(--st-work)}
  .planet.st-rezolvat .body{fill:var(--space-0);stroke:var(--st-done);stroke-width:1.5}
  .planet .glow{fill:none;stroke:var(--st-work);stroke-width:5;opacity:0;transition:opacity var(--t-card),r var(--t-card) var(--ease)}
  .planet.st-in_lucru .glow{opacity:.9}
  .planet .halo{display:none;fill:none;stroke:var(--st-crit);stroke-width:1.5;stroke-opacity:.35}
  .planet.pr-critica .halo{display:block}
  .planet .s1,.planet .s2{display:none;fill:none;stroke:var(--acc)}
  .planet .s1{stroke-width:1.2;stroke-opacity:.6}
  .planet .s2{stroke-width:1;stroke-opacity:.25}
  .planet.sel .s1,.planet.sel .s2{display:block}
  .planet .hit{fill:transparent;stroke:none}
  .planet:focus-visible .hit{stroke:var(--acc);stroke-width:2}
  .planet:hover .body,.planet:focus-visible .body{transform:scale(1.25)}
  .planet.dim{opacity:.12;pointer-events:none}
  .planet.dim .body{transform:scale(.6)}
  .wave{fill:none;stroke:var(--acc);stroke-width:1.5;transform-box:fill-box;transform-origin:center;pointer-events:none}

  .lbl{pointer-events:none;transition:opacity var(--t-card)}
  .lbl.dim{opacity:.12}
  .lbl.flying{opacity:0}
  #sys.far .lbl.dim{opacity:0}
  .lbl.dim .ttl{display:none}
  .lbl line{stroke:var(--ink);stroke-opacity:.3;stroke-width:1;transition:stroke var(--t-fast),stroke-opacity var(--t-fast)}
  #sys:not(.far) .lbl line{display:none}
  .lbl .code{font:500 11px var(--mono);letter-spacing:.04em;fill:var(--ink-3);paint-order:stroke;stroke:var(--space-0);stroke-width:3px;stroke-linejoin:round;transition:fill var(--t-fast)}
  .lbl .ttl{font:400 13px var(--font);fill:var(--ink);opacity:0;paint-order:stroke;stroke:var(--space-0);stroke-width:3px;stroke-linejoin:round;transition:opacity var(--t-fast)}
  .lbl.sel .code{fill:var(--acc-h)}
  .lbl.sel line{stroke:var(--acc);stroke-opacity:1}
  .planet:hover + .lbl line,.planet:focus-visible + .lbl line{stroke-opacity:.7}
  .planet:hover + .lbl .code,.planet:focus-visible + .lbl .code{fill:var(--ink)}
  #sys.far .ttl,.planet:hover + .lbl .ttl,.planet:focus-visible + .lbl .ttl,.lbl.sel .ttl{opacity:1}

  .map-msg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding-bottom:var(--sp-7)}
  .map-msg .empty{pointer-events:auto;background:var(--glass-dark);border:1px solid var(--glass-line);border-radius:var(--r-card);padding:var(--sp-5)}
  .legend{position:absolute;left:32px;bottom:46px;display:flex;flex-wrap:wrap;gap:6px 18px;font:400 11px/1.2 var(--mono);color:var(--ink-3);pointer-events:none}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .lg{display:inline-block;width:9px;height:9px;border-radius:50%}
  .lg-open{background:var(--st-open)}
  .lg-work{background:var(--st-work);box-shadow:0 0 7px var(--st-work)}
  .lg-done{border:1.5px solid var(--st-done)}
  .ticker{position:absolute;left:32px;right:32px;bottom:14px;margin:0 auto;width:max-content;max-width:calc(100% - 64px);height:32px;padding:0 8px;border:0;background:none;
    font:400 11px var(--mono);letter-spacing:.04em;color:var(--ink-3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ticker b{color:var(--acc-h);font-weight:400}
  .ticker:hover{color:var(--ink)}
  body.card-open .ticker{right:480px}
  [data-view="list"] .legend,[data-view="list"] .ticker{display:none}

  /* ---------- vederea Listă ---------- */
  .list{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:8px 32px 24px}
  body.card-open .list{right:448px;padding-right:24px}
  .row{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr) auto auto;column-gap:var(--sp-4);align-items:center;width:100%;min-height:64px;
    padding:10px 20px;margin-bottom:8px;border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);color:var(--ink);text-align:left;cursor:pointer;font:inherit;
    transition:background-color var(--t-fast),border-color var(--t-fast)}
  .row:hover{background:var(--glass-2)}
  .row[aria-current="true"]{border-color:var(--acc);background:var(--glass-2)}
  .row:focus-visible{outline-offset:2px}
  .r-code{font:500 13px var(--mono);letter-spacing:.04em;white-space:nowrap}
  .row.resolved .r-code,.row.resolved .r-title{color:var(--ink-2)}
  .r-t{min-width:0}
  .r-title{display:block;font-size:var(--fs-row);font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-by{display:flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-n{display:inline-flex;align-items:center;gap:3px;margin-left:var(--sp-2)}
  .r-by .ic{width:13px;height:13px}
  .pr{display:inline-flex;align-items:center}
  .dots{display:inline-flex;align-items:center;gap:4px}
  .dots i{display:block;width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-3)}
  .dots i.on{background:var(--ink);border-color:var(--ink)}
  .pr.critica .dots i.on{background:var(--st-crit);border-color:var(--st-crit)}
  .empty{padding:var(--sp-6) var(--sp-3);max-width:560px}
  .empty h3{font-size:var(--fs-lg);font-weight:600;margin-bottom:var(--sp-2)}
  .empty p{color:var(--ink-2)}
  .empty p + p{margin-top:var(--sp-2)}
  .empty .btn{margin-top:var(--sp-4)}
  .skel{display:grid;grid-template-columns:84px minmax(0,1fr) auto auto;column-gap:var(--sp-4);align-items:center;min-height:64px;padding:10px 20px;margin-bottom:8px;
    border-radius:14px;background:var(--glass);animation:skel 1.1s ease-in-out infinite alternate}
  .skel i{display:block;height:10px;border-radius:5px;background:var(--glass-2);width:70%}
  @keyframes skel{to{opacity:.45}}
  .more{display:block;width:100%;height:48px;margin-bottom:8px;border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);color:var(--ink);font-weight:500;cursor:pointer}
  .more:hover{background:var(--glass-2)}
  .list-end{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-3) var(--sp-2) var(--sp-5);font-size:var(--fs-sm);color:var(--ink-2)}
  .list-end .keys-inline{margin-left:auto;display:inline-flex;align-items:center;gap:6px}

  /* ---------- cardul de detaliu (sticlă) ---------- */
  .panel{position:fixed;z-index:30;top:88px;right:24px;bottom:24px;width:var(--card-w);overflow:auto;border-radius:var(--r-card);
    background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow-card);
    transform:translateX(48px);opacity:0;visibility:hidden;
    transition:transform var(--t-card) var(--ease),opacity var(--t-card) var(--ease),visibility 0s linear var(--t-card)}
  .panel.open{transform:none;opacity:1;visibility:visible;transition:transform var(--t-card) var(--ease),opacity var(--t-card) var(--ease)}
  .panel-inner{padding:28px 28px var(--sp-6)}
  .p-top{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-4)}
  .p-code{font:500 12px var(--mono);letter-spacing:.06em;color:var(--acc-h);margin-right:auto}
  .p-back{display:none}
  .p-title{font-size:var(--fs-2xl);font-weight:500;line-height:1.18;letter-spacing:-.01em;margin:0 0 var(--sp-4);overflow-wrap:anywhere;text-wrap:balance}
  .p-title:focus{outline:none}
  .who{display:flex;align-items:center;gap:10px;margin:var(--sp-5) 0 var(--sp-2);font-size:var(--fs-sm);color:var(--ink-2)}
  .who b{font-weight:500;color:var(--ink)}
  .who time{margin-left:auto;font:400 11px var(--mono);color:var(--ink-3);white-space:nowrap}
  .upd{margin:0 0 var(--sp-2) 38px}
  .avatar{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;font:500 10px var(--mono);color:var(--ink);
    background:color-mix(in srgb,var(--acc) 25%,transparent);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent)}
  .p-section{margin-top:var(--sp-5)}
  .cap{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:var(--sp-2)}
  .desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:var(--fs-row);color:var(--ink)}
  .desc.none{color:var(--ink-3);font-size:var(--fs-md)}
  .admin-box{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4) var(--sp-3);padding:var(--sp-4);background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;margin-top:var(--sp-5)}
  .admin-box .full{grid-column:1 / -1}
  .admin-box .seg{display:flex;width:100%}
  .admin-box .seg button{flex:1;padding:0 6px}
  .admin-box .select{height:38px;border-radius:var(--r-pill);padding-left:14px}
