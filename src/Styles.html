<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  html{overflow-x:clip}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-md);line-height:1.45;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  ::selection{background:var(--acc);color:var(--on-acc)}
  .bar,.board,.p-strip,.done-board,.jt,.lightbox{--acc:var(--sig);--acc-h:var(--sig-h);--on-acc:var(--on-sig);--focus:var(--sig)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  [hidden]{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke-linecap:square;stroke-linejoin:miter}
  button{font:inherit;color:inherit}
  h1,h2,h3,p,dl,dd,ol{margin:0}
  input,textarea{caret-color:var(--ink)}
  *{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  .skip{position:fixed;left:var(--sp-3);top:var(--sp-3);z-index:100;background:var(--on-sig);color:var(--sig);font-weight:700;
    padding:var(--sp-2) var(--sp-3);transform:translateY(-200%)}
  .skip:focus{transform:none}

  /* ---------- plăcuțe split-flap (semnătura) ---------- */
  .flap{--fh:22px;--fw:14px;display:inline-flex;gap:2px;flex:none;vertical-align:middle;font-size:14px;font-weight:700;
    font-stretch:var(--w-plate);line-height:var(--fh);text-transform:uppercase;color:var(--fc,var(--b-ink))}
  .flap > .sr{text-transform:none}
  .ch{position:relative;display:inline-block;width:var(--fw);height:var(--fh);text-align:center;white-space:pre;border-radius:2px;
    background:linear-gradient(var(--b-plate-top) 50%,var(--b-plate) 50%);perspective:160px}
  .ch::before{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:var(--b-split);z-index:2}
  .ch.fa::after,.ch.fb::after{content:attr(data-p);position:absolute;left:0;right:0;top:0;height:50%;overflow:hidden;border-radius:2px 2px 0 0;
    background:var(--b-plate-top);color:var(--fc,var(--b-ink));transform-origin:50% 100%;z-index:1;animation:flapA 80ms var(--ease-in) forwards}
  .ch.fb::after{animation-name:flapB}
  @keyframes flapA{from{transform:rotateX(0)}to{transform:rotateX(-90deg);filter:brightness(.55)}}
  @keyframes flapB{from{transform:rotateX(0)}to{transform:rotateX(-90deg);filter:brightness(.55)}}
  .flap.sm{--fh:18px;--fw:11px;font-size:11.5px;gap:1px}
  .flap.xl{--fh:96px;--fw:58px;font-size:72px;gap:4px;font-weight:800}
  .flap.xl .ch{border-radius:4px}
  .flap.xl .ch::before{height:2px;top:calc(50% - 1px)}
  .c-open{--fc:var(--st-open)}
  .c-work{--fc:var(--st-work)}
  .c-done{--fc:var(--st-done)}
  .c-crit{--fc:var(--st-crit)}

  /* ---------- controale ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:38px;padding:0 var(--sp-4);
    border:1px solid transparent;border-radius:var(--radius);background:none;cursor:pointer;font-weight:700;font-size:var(--fs-md);
    font-stretch:108%;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,transform .12s var(--ease)}
  .btn:active:not(:disabled){transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn .ar{transition:transform .25s var(--ease)}
  .btn:hover:not(:disabled) .ar{transform:translateX(3px)}
  .btn-primary{background:var(--acc);color:var(--on-acc);box-shadow:inset 0 -2px 0 rgba(11,12,14,.22)}
  .btn-primary:hover:not(:disabled){background:var(--acc-h)}
  .btn-quiet{border-color:var(--line-strong);background:transparent;color:var(--ink)}
  .btn-quiet:hover:not(:disabled){border-color:var(--ink);background:var(--surface)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger-quiet{border-color:var(--line-strong);background:transparent;color:var(--danger)}
  .btn-danger-quiet:hover{border-color:var(--danger)}
  .btn-board{border-color:var(--b-field-line);background:transparent;color:var(--b-ink)}
  .btn-board:hover:not(:disabled){border-color:var(--b-ink-2);background:var(--b-hover)}
  .icon-only{width:38px;padding:0}
  .btn.busy{position:relative;color:transparent !important}
  .btn.busy::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--on-acc);border-right-color:transparent;
    border-radius:50%;animation:spin .7s linear infinite}
  .btn-quiet.busy::after{border-color:var(--ink);border-right-color:transparent}
  @keyframes spin{to{transform:rotate(360deg)}}

  .input,.select,.textarea{width:100%;height:40px;padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--radius);
    background:var(--surface);color:var(--ink);font:inherit;font-size:var(--fs-md);transition:border-color .15s,box-shadow .15s}
  .textarea{height:auto;min-height:104px;padding:var(--sp-2) var(--sp-3);resize:vertical;line-height:1.55}
  .select{appearance:none;padding-right:30px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
  .input::placeholder,.textarea::placeholder{color:var(--ink-3);opacity:1}
  .input:hover,.select:hover,.textarea:hover{border-color:var(--ink-3)}
  .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
  .lbl{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--ink);margin-bottom:6px}
  .lbl .opt{font-weight:400;color:var(--ink-3)}
  .hint{font-size:var(--fs-xs);color:var(--ink-3)}
  .field{margin-bottom:var(--sp-5)}
  .field-err{font-size:var(--fs-sm);font-weight:600;color:var(--danger);margin-top:6px}
  .row-end{display:flex;justify-content:flex-end;gap:var(--sp-2)}
  kbd{font:700 var(--fs-xs)/1 var(--font);border:1px solid var(--line-strong);padding:3px 6px;border-radius:2px;color:var(--ink-2);background:var(--surface)}

  /* control segmentat (hol) */
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;flex:none}
  .seg button{height:36px;padding:0 var(--sp-3);border:0;border-left:1px solid var(--line);background:none;cursor:pointer;color:var(--ink-2);
    font-size:var(--fs-sm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .seg button:first-child{border-left:0}
  .seg button:hover{color:var(--ink);background:var(--surface-2)}
  .seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--acc);color:var(--on-acc);font-weight:700}
  .seg button .n{font-size:var(--fs-xs);opacity:.8}
  .seg.full{display:flex}
  .seg.full button{flex:1}

  /* ---------- bara de sus (material de panou) ---------- */
  .bar{height:var(--bar-h);flex:none;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-5) 0 var(--sp-4);
    background:var(--b-case);color:var(--b-ink);color-scheme:dark;border-bottom:1px solid var(--b-line);position:relative;z-index:20}
  .bar :focus-visible{outline-color:var(--sig)}
  .brand{display:flex;align-items:center;gap:10px;flex:none}
  .brand-flaps .flap{--fh:30px;--fw:21px;font-size:20px;font-weight:800}
  .brand-name{font-size:21px;font-weight:800;font-stretch:var(--w-wide);letter-spacing:-.01em;line-height:1}
  .tabs{display:flex;align-self:stretch}
  .tab{position:relative;border:0;background:none;padding:0 var(--sp-4);cursor:pointer;color:var(--b-ink-2);font-weight:700;
    font-size:15px;font-stretch:var(--w-sign);transition:background-color .15s,color .15s}
  .tab::after{content:"";position:absolute;left:var(--sp-4);right:var(--sp-4);bottom:12px;height:3px;background:currentColor;
    transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
  .tab:hover{color:var(--b-ink)}
  .tab:hover::after{transform:none}
  .tab[aria-current="page"]{color:var(--b-ink);background:none}
  .tab[aria-current="page"]::after{transform:none;background:var(--sig);bottom:0}
  .bar .tab:focus-visible{outline-offset:-4px}
  .bar-actions{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2)}
  .btn-sign{background:var(--sig);color:var(--on-sig);height:38px;font-stretch:var(--w-sign)}
  .btn-sign:hover{background:var(--sig-h)}
  .btn-sign:focus-visible{outline-offset:3px}
  .admin-wrap{position:relative}
  .admin-on #adminBtn .dot{width:8px;height:8px;border-radius:50%;background:var(--sig);display:inline-block}
  .pop{position:absolute;right:0;top:calc(100% + 10px);width:290px;padding:var(--sp-4);background:var(--surface);color:var(--ink);
    border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-pop);z-index:40}
  .pop :focus-visible{outline-color:var(--focus)}
  .pop .input{margin-bottom:var(--sp-3)}

  /* ---------- hol ---------- */
  main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
  main:focus{outline:none}
  .page{flex:1;min-height:0}
  #page-tichete{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w)}
  @media (min-width:901px){
    #page-tichete:not(:has(> .panel.open)){grid-template-columns:minmax(0,1fr)}
    #page-tichete:not(:has(> .panel.open)) > .panel{display:none}
  }

  /* ---------- panoul ---------- */
  .board{--cols:84px minmax(0,1fr) 72px 128px;--pad:var(--sp-5);
    min-height:0;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;
    background:var(--b-case);color:var(--b-ink);color-scheme:dark;scrollbar-color:var(--b-field-line) transparent;box-shadow:1px 0 0 var(--b-line)}
  .board :focus-visible{outline-color:var(--sig)}
  .board input{caret-color:var(--sig)}
  .board ::-webkit-scrollbar-thumb{background:var(--b-field-line);background-clip:padding-box}

  .filters{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3);padding:16px var(--pad) 0}
  .filters .select{height:38px;width:auto;min-width:150px}
  .search{position:relative;flex:1 1 240px;min-width:200px}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--b-ink-2)}
  .search .input{padding-left:38px;padding-right:38px}
  .search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
  .search .input:focus ~ kbd{display:none}
  .board .input,.board .select{background:var(--b-field);border-color:var(--b-field-line);color:var(--b-ink)}
  .board .input::placeholder{color:var(--b-ph)}
  .board .input:hover,.board .select:hover{border-color:var(--b-ink-2)}
  .board kbd{background:var(--b-field);border-color:var(--b-field-line);color:var(--b-ink-2)}
  .board .seg{border-color:var(--b-field-line)}
  .board .seg button{height:38px;color:var(--b-ink-2);border-left-color:var(--b-line)}
  .board .seg button:hover{color:var(--b-ink);background:var(--b-hover)}
  .board .seg button[aria-pressed="true"]{background:var(--sig);color:var(--on-sig)}

  .zchips{flex:1 1 auto;min-width:0;display:flex;gap:var(--sp-2);flex-wrap:wrap}
  .zchip{display:inline-flex;align-items:center;gap:var(--sp-2);height:34px;padding:0 10px;border:0;background:transparent;color:var(--b-ink-2);
    cursor:pointer;font-weight:600;font-size:var(--fs-sm);white-space:nowrap;transition:background-color .15s,color .15s}
  .zchip .zi{width:16px;height:16px;transition:transform .45s var(--ease)}
  .zchip:hover{color:var(--b-ink);background:var(--b-hover)}
  .zchip:hover .zi{transform:rotateY(180deg)}
  .zchip .zn{font-size:var(--fs-xs);font-weight:700;color:var(--b-ink-2)}
  .zchip[aria-pressed="true"]{color:var(--b-ink);background:transparent;box-shadow:inset 0 -2px 0 var(--sig)}
  .zchip[aria-pressed="true"] .zn{color:var(--b-ink)}
  .zi{width:16px;height:16px;flex:none;color:currentColor}

  .meta-line{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--pad) var(--sp-3)}
  .list-meta{flex:none;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--b-ink-2);min-height:32px}
  .meta-line .select{height:34px;width:auto;min-width:150px;font-size:var(--fs-sm)}
  .meta-line .icon-only{height:34px;width:34px}
  .linkish{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
  .board .linkish{color:var(--b-ink)}

  .cols{flex:none;display:grid;grid-template-columns:var(--cols);column-gap:var(--sp-3);padding:0 var(--pad);height:30px;align-items:center;
    border-bottom:1px solid var(--b-line);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--b-ink-2)}
  .list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

  .row{position:relative;display:grid;grid-template-columns:var(--cols);column-gap:var(--sp-3);align-items:center;width:100%;
    min-height:var(--row-h);padding:6px var(--pad);border:0;border-bottom:1px solid var(--b-line);background:var(--b-case);color:var(--b-ink);
    text-align:left;cursor:pointer;font:inherit;transition:background-color .15s}
  .row::before{content:"";position:absolute;left:0;top:50%;width:4px;height:26px;margin-top:-13px;background:var(--sig);
    transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease)}
  .row:hover{background:var(--b-hover)}
  .row:hover::before,.row[aria-current="true"]::before{transform:none}
  .row[aria-current="true"]{background:var(--b-sel)}
  .row:focus-visible{outline-offset:-3px}
  .r-code{font-size:14px;font-weight:700;font-stretch:var(--w-plate);letter-spacing:.03em;white-space:nowrap;color:var(--b-ink)}
  .row.resolved .r-code{color:var(--b-ink-2)}
  .r-zone{display:inline-flex;align-items:center;gap:4px;font:inherit;text-transform:none;letter-spacing:0;color:inherit}
  .r-zone .zi{width:13px;height:13px}
  .r-t{min-width:0}
  .r-title{display:block;font-size:var(--fs-row);font-weight:500;font-stretch:var(--w-title);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-by{display:flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--b-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-n{display:inline-flex;align-items:center;gap:3px;margin-left:var(--sp-2);font-weight:600}
  .r-by .ic{width:13px;height:13px}
  .row.resolved .r-title{color:var(--b-ink-2)}
  .pr{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;
    font-stretch:var(--w-title);white-space:nowrap;color:var(--b-ink-2)}
  .bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
  .bars i{display:block;width:3px;background:var(--b-field-line)}
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}
  .bars i.on{background:var(--b-ink)}
  .pr.ridicata{color:var(--b-ink)}
  .pr.critica{color:var(--st-crit)}
  .pr.critica .bars i.on{background:var(--st-crit)}
  .row .pr:not(.critica) .lbl-pr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .r-st{display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .row.flash{animation:rowFlash 1.6s var(--ease)}
  @keyframes rowFlash{0%,30%{background:#221D3D}100%{background:var(--b-case)}}
  .list.intro .r-t,.list.intro .r-code,.list.intro .pr{animation:reveal .7s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 120ms)}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

  .empty{padding:var(--sp-6) var(--pad);max-width:560px}
  .empty h3{font-size:var(--fs-lg);font-weight:800;font-stretch:var(--w-sign);margin-bottom:var(--sp-2)}
  .empty p{color:var(--b-ink-2)}
  .empty p + p{margin-top:var(--sp-2)}
  .empty .btn{margin-top:var(--sp-4)}
  .hall-page .empty p{color:var(--ink-3)}
  .skel{display:grid;grid-template-columns:var(--cols);column-gap:var(--sp-3);align-items:center;min-height:var(--row-h);padding:6px var(--pad);
    border-bottom:1px solid var(--b-line);animation:skel 1.1s ease-in-out infinite alternate}
  .skel i{display:block;height:10px;background:var(--b-plate);width:70%}
  @keyframes skel{to{opacity:.45}}
  .more{display:block;width:100%;height:52px;border:0;border-bottom:1px solid var(--b-line);background:var(--b-case);color:var(--b-ink);
    font-weight:700;font-stretch:var(--w-sign);cursor:pointer}
  .more:hover{background:var(--b-hover)}
  .list-end{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-4) var(--pad) var(--sp-6);font-size:var(--fs-sm);color:var(--b-ink-2)}
  .list-end .linkish{height:32px;padding:0 4px}
  .list-end .keys-inline{margin-left:auto;display:inline-flex;align-items:center;gap:6px}

  /* ---------- holul: panoul de detaliu ---------- */
  .panel{min-height:0;overflow:auto;position:relative}
  .panel-inner{padding:var(--sp-5) 28px var(--sp-7)}
  .p-strip{display:flex;align-items:center;gap:var(--sp-3);padding:8px var(--sp-3);background:var(--b-case);color:var(--b-ink);
    color-scheme:dark;border-radius:var(--radius);margin-bottom:var(--sp-4)}
  .p-strip :focus-visible{outline-color:var(--sig)}
  .p-strip .btn{height:32px}
  .p-back{display:none}
  .p-strip .r-st{margin-left:auto}
  .p-strip .p-copy{padding:0 var(--sp-2)}
  .p-zone{display:flex;align-items:center;gap:var(--sp-2)}
  .p-title{font-size:1.75rem;font-weight:600;font-stretch:var(--w-title);line-height:1.12;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .p-title:focus{outline:none}
  .p-facts{display:grid;grid-template-columns:auto 1fr;gap:8px var(--sp-5);margin:var(--sp-5) 0 0;font-size:var(--fs-sm)}
  .p-facts dt{color:var(--ink-3);font-weight:600}
  .p-facts dd{margin:0;color:var(--ink)}
  .p-facts .pr{color:var(--ink-2)}
  .p-facts .pr.critica{color:var(--danger)}
  .p-facts .pr .bars i{background:var(--line)}
  .p-facts .pr .bars i.on{background:var(--ink)}
  .p-facts .pr.critica .bars i.on{background:var(--danger)}
  .p-section{border-top:1px solid var(--line);padding-top:var(--sp-4);margin-top:var(--sp-5)}
  .p-section > h3{font-size:var(--fs-md);font-weight:700;font-stretch:var(--w-body);letter-spacing:0;text-transform:none;
    margin-bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2)}
  .p-section > h3 .n{color:var(--ink-3);font-weight:600}
  .desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15px;max-width:65ch}
  .desc.none{color:var(--ink-3);font-size:var(--fs-md)}
  .admin-box{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4) var(--sp-3);padding:var(--sp-4);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);margin-top:var(--sp-5)}
  .admin-box .full{grid-column:1 / -1}
  .admin-box .seg{display:flex;width:100%}
  .admin-box .seg button{flex:1}
  .admin-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
  .confirm{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-3);border:1px solid var(--danger);
    background:var(--danger-soft);border-radius:var(--radius);font-size:var(--fs-sm)}
  .confirm span{flex:1 1 200px}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--sp-2)}
  .shot{position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:zoom-in;overflow:hidden;border-radius:var(--radius)}
  .shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s,transform .4s var(--ease)}
