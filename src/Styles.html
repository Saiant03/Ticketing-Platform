<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  html{overflow-x:clip}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-md);line-height:1.45;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  ::selection{background:var(--sel-line);color:var(--ink)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  [hidden]{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke-linecap:square;stroke-linejoin:miter}
  button{font:inherit;color:inherit}
  h1,h2,h3,p{margin:0}
  * { scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid var(--bg);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  .skip{position:fixed;left:var(--sp-3);top:var(--sp-3);z-index:100;background:var(--primary);color:var(--on-primary);
    padding:var(--sp-2) var(--sp-3);border-radius:var(--radius);transform:translateY(-200%)}
  .skip:focus{transform:none}

  /* ---------- controale ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:36px;padding:0 var(--sp-3);
    border:1px solid transparent;border-radius:var(--radius);background:none;cursor:pointer;font-weight:600;font-size:var(--fs-md);
    white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--primary);color:var(--on-primary)}
  .btn-primary:hover:not(:disabled){background:var(--primary-hover)}
  .btn-quiet{border-color:var(--line);background:var(--surface);color:var(--ink-2)}
  .btn-quiet:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger-quiet{border-color:var(--line);background:var(--surface);color:var(--danger)}
  .btn-danger-quiet:hover{border-color:var(--danger)}
  .btn-ghost-inv{color:#fff;border-color:rgba(255,255,255,.25)}
  .btn-ghost-inv:hover{background:rgba(255,255,255,.12)}
  .icon-only{width:36px;padding:0}
  .btn.busy{position:relative;color:transparent !important}
  .btn.busy::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--on-primary);border-right-color:transparent;
    border-radius:50%;animation:spin .7s linear infinite}
  .btn-quiet.busy::after{border-color:var(--ink-2);border-right-color:transparent}
  @keyframes spin{to{transform:rotate(360deg)}}

  .input,.select,.textarea{width:100%;height:36px;padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--radius);
    background:var(--surface);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
  .textarea{height:auto;min-height:96px;padding:var(--sp-2) var(--sp-3);resize:vertical;line-height:1.5}
  .select{appearance:none;padding-right:30px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .input::placeholder,.textarea::placeholder{color:var(--ink-3);opacity:1}
  .input:hover,.select:hover,.textarea:hover{border-color:var(--ink-3)}
  .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
  .input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
  .lbl{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);margin-bottom:var(--sp-1)}
  .lbl .opt{font-weight:400;color:var(--ink-3)}
  .hint{font-size:var(--fs-xs);color:var(--ink-3);margin-top:var(--sp-1)}
  .field{margin-bottom:var(--sp-4)}
  .field-err{font-size:var(--fs-sm);color:var(--danger);margin-top:var(--sp-1)}
  .row-end{display:flex;justify-content:flex-end;gap:var(--sp-2)}

  /* segmented control */
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);overflow:hidden;flex:none}
  .seg button{height:34px;padding:0 var(--sp-3);border:0;border-left:1px solid var(--line);background:none;cursor:pointer;color:var(--ink-2);
    font-size:var(--fs-sm);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .seg button:first-child{border-left:0}
  .seg button:hover{color:var(--ink);background:var(--surface-2)}
  .seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface);font-weight:600}
  .seg button .n{font-size:var(--fs-xs);opacity:.75}

  /* ---------- bară de sus ---------- */
  body{display:flex;flex-direction:column;min-height:100vh;overflow-x:clip}
  .top{height:var(--header-h);flex:none;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-5);
    background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
  .brand{display:flex;align-items:center;gap:var(--sp-3);flex:none}
  .mark{display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(2,7px);gap:2px}
  .mark i{display:block}
  .brand-name{font-weight:700;font-size:var(--fs-lg);letter-spacing:-.01em;font-stretch:112%}
  .tabs{display:flex;align-self:stretch;gap:var(--sp-1)}
  .tab{position:relative;border:0;background:none;padding:0 var(--sp-3);cursor:pointer;color:var(--ink-3);font-weight:600}
  .tab:hover{color:var(--ink)}
  .tab[aria-current="page"]{color:var(--ink)}
  .tab[aria-current="page"]::after{content:"";position:absolute;left:var(--sp-3);right:var(--sp-3);bottom:-1px;height:3px;background:var(--ink)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2)}
  .admin-wrap{position:relative}
  .admin-on #adminBtn{color:var(--ink)}
  .admin-on #adminBtn .dot{width:8px;height:8px;background:var(--ok);display:inline-block}
  .pop{position:absolute;right:0;top:calc(100% + 8px);width:280px;padding:var(--sp-4);background:var(--surface);border:1px solid var(--line-strong);
    border-radius:var(--radius);box-shadow:var(--shadow-pop);z-index:40}
  .pop .input{margin-bottom:var(--sp-3)}

  main{flex:1;min-height:0;display:flex;flex-direction:column}
  main:focus{outline:none}
  .page{flex:1;min-height:0;display:flex;flex-direction:column}

  /* ---------- bara de zone (semnătura) ---------- */
  .zones{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:var(--sp-3) var(--sp-5) 0}
  .zone-band{display:flex;height:8px;gap:2px;background:var(--surface-3)}
  .zone-band span{display:block;min-width:0;transition:flex-grow .3s var(--ease),opacity .15s}
  .zone-band.filtered span{opacity:.25}
  .zone-band.filtered span.on{opacity:1}
  .zone-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;margin:0 calc(var(--sp-2) * -1)}
  .zbtn{display:flex;align-items:center;gap:var(--sp-2);min-width:0;height:48px;padding:0 var(--sp-2);border:0;background:none;cursor:pointer;
    text-align:left;border-bottom:3px solid transparent;color:var(--ink-2)}
  .zbtn:hover{background:var(--surface-2);color:var(--ink)}
  .zbtn[aria-pressed="true"]{border-bottom-color:var(--ink);color:var(--ink)}
  .zbtn .zname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zbtn .zn{margin-left:auto;font-weight:700;font-size:var(--fs-lg);color:var(--ink)}
  .zbtn .zn.zero{color:var(--ink-3);font-weight:500}
  .zone-total{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 var(--sp-2) 0 var(--sp-4);
    border-left:1px solid var(--line);margin:var(--sp-2) 0 var(--sp-2) var(--sp-2);white-space:nowrap}
  .zone-total b{font-size:var(--fs-lg)}
  .zone-total small{font-size:var(--fs-xs);color:var(--ink-3)}
  .zone-total .crit{color:var(--danger);font-weight:600}

  /* pictograma de zonă: pătrat plin, glif în culoarea de contrast */
  .zt{width:24px;height:24px;flex:none;display:grid;place-items:center;background:var(--zc);color:var(--zo)}
  .zt svg{width:14px;height:14px}
  .zt.lg{width:32px;height:32px}
  .zt.lg svg{width:18px;height:18px}
  .zt.none{background:none;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-strong)}

  /* ---------- zona de lucru ---------- */
  .work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w)}
  .list-col{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-5)}
  .search{position:relative;flex:1 1 220px;min-width:180px}
  .search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  .search .input{padding-left:34px;padding-right:34px}
  .search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 var(--fs-xs)/1 var(--font);color:var(--ink-3);
    border:1px solid var(--line-strong);padding:3px 6px;border-radius:2px}
  .search .input:focus ~ kbd{display:none}
  .sel-wrap{flex:none}
  .sel-wrap .select{width:auto;min-width:150px}
  .list-head{flex:none;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5) var(--sp-2)}
  .list-meta{flex:1;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-3);min-height:28px}
  .sort{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--ink-3);flex:none}
  .sort .select{height:32px;width:auto;font-size:var(--fs-sm)}
  .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;border:1px solid var(--line-strong);
    border-radius:var(--radius);background:var(--surface);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;cursor:pointer}
  .chip .ic{width:12px;height:12px}
  .chip:hover{border-color:var(--ink-3);color:var(--ink)}
  .linkish{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

  .list{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--surface)}
  .row{display:grid;grid-template-columns:24px 64px minmax(0,1fr) 112px 104px 64px;align-items:center;gap:var(--sp-3);
    min-height:var(--row-h);padding:var(--sp-2) var(--sp-5);border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);
    width:100%;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit}
  .row:hover{background:var(--surface-2)}
  .row[aria-current="true"]{background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-line)}
  .row:focus-visible{outline-offset:-2px}
  .row .code{font-weight:700;font-size:var(--fs-sm);letter-spacing:.02em;color:var(--ink-2)}
  .row .t{min-width:0}
  .row .title{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .by{display:block;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .counts{display:flex;gap:var(--sp-2);justify-content:flex-end;color:var(--ink-3);font-size:var(--fs-xs)}
  .row .counts span{display:inline-flex;align-items:center;gap:3px}
  .row .counts .ic{width:13px;height:13px}
  .row.resolved .title{color:var(--ink-2);font-weight:500}
  .row.flash{animation:flash 1.2s var(--ease)}
  @keyframes flash{0%{background:var(--sel)}100%{background:var(--surface)}}

  .st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);white-space:nowrap}
  .st svg{width:14px;height:14px}
  .st.deschis{color:var(--ink)}
  .st.rezolvat{color:var(--ink-3)}

  /* prioritate: bare ca la semnal, critică în roșu */
  .pr{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap}
  .bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
  .bars i{display:block;width:3px;background:var(--line-strong)}
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}
  .bars i.on{background:var(--ink)}
  .pr.critica{color:var(--danger);font-weight:700}
  .pr.critica .bars i.on{background:var(--danger)}

  .empty{padding:var(--sp-6) var(--sp-5);color:var(--ink-3);max-width:520px}
  .empty h3{color:var(--ink);font-size:var(--fs-lg);margin-bottom:var(--sp-2)}
  .empty p + p{margin-top:var(--sp-2)}
  .empty .btn{margin-top:var(--sp-4)}
  .skel{height:var(--row-h);border-bottom:1px solid var(--line);padding:var(--sp-3) var(--sp-5);display:grid;
    grid-template-columns:24px 64px minmax(0,1fr) 112px;gap:var(--sp-3);align-items:center}
  .skel i{display:block;height:12px;background:var(--surface-3);animation:pulse 1.2s ease-in-out infinite alternate}
  .skel i:first-child{height:24px}
  @keyframes pulse{to{opacity:.45}}
  .more{display:block;width:100%;height:48px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    font-weight:600;cursor:pointer}
  .more:hover{background:var(--surface-2);color:var(--ink)}

  /* ---------- panou de detaliu ---------- */
  .panel{min-height:0;overflow:auto;background:var(--surface)}
  .panel-inner{padding:var(--sp-5)}
  .panel-inner.zoned{border-top:4px solid var(--zc)}
  .panel-inner.zoned.none{border-top-color:var(--line-strong)}
  .p-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
  .p-head .zlabel{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
  .p-head .code{font-weight:700;letter-spacing:.02em}
  .p-head .spacer{flex:1}
  .p-back{display:none}
  .h2{font-size:var(--fs-xl);font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .p-facts{display:grid;grid-template-columns:auto 1fr;gap:6px var(--sp-4);margin:var(--sp-4) 0;font-size:var(--fs-sm)}
  .p-facts dt{color:var(--ink-3)}
  .p-facts dd{margin:0;color:var(--ink-2)}
  .p-section{border-top:1px solid var(--line);padding-top:var(--sp-4);margin-top:var(--sp-4)}
  .p-section > h3{font-size:var(--fs-sm);font-weight:700;color:var(--ink-2);margin-bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2)}
  .p-section > h3 .n{color:var(--ink-3);font-weight:500}
  .desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;color:var(--ink)}
  .desc.none{color:var(--ink-3)}
  .admin-box{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface-2);border:1px solid var(--line);
    border-radius:var(--radius);margin-top:var(--sp-4)}
  .admin-box .full{grid-column:1 / -1}
  .admin-box .lbl{margin-bottom:2px}
  .admin-box .seg{width:100%}
  .admin-box .seg button{flex:1;justify-content:center}
  .admin-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
  .confirm{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-3);border:1px solid var(--danger);
    background:var(--danger-soft);border-radius:var(--radius);font-size:var(--fs-sm)}
  .confirm span{flex:1 1 200px}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--sp-2)}
  .shot{position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:zoom-in;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
  .shot img.ready{opacity:1}
  .shot:hover{border-color:var(--ink-3)}

  .thread{display:flex;flex-direction:column;gap:var(--sp-3)}
  .cmt{display:grid;grid-template-columns:28px 1fr;gap:var(--sp-2)}
  .avatar{width:28px;height:28px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);font-weight:700;font-size:var(--fs-xs)}
  .cmt.admin .avatar{background:var(--ink);color:var(--surface)}
  .cmt-h{font-size:var(--fs-xs);color:var(--ink-3)}
  .cmt-h b{color:var(--ink);font-size:var(--fs-sm)}
  .cmt-h .role{display:inline-block;margin-left:4px;padding:0 5px;border:1px solid var(--line-strong);font-weight:600;color:var(--ink-2);font-size:11px}
  .cmt-t{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
  .composer{margin-top:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}
  .composer .textarea{min-height:72px}

  /* formular tichet nou */
  .zpick{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
  .zpick button{display:flex;align-items:center;gap:var(--sp-2);height:40px;padding:0 var(--sp-2);border:1px solid var(--line-strong);
    border-radius:var(--radius);background:var(--surface);cursor:pointer;font-weight:500;text-align:left;color:var(--ink-2)}
  .zpick button:hover{border-color:var(--ink-3);color:var(--ink)}
  .zpick button[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-weight:600}
  .seg.full{display:flex}
  .seg.full button{flex:1;justify-content:center}
  .similar{margin-top:var(--sp-2);border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius)}
  .similar p{font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);padding:var(--sp-2) var(--sp-3) 0}
  .similar button{display:flex;gap:var(--sp-2);align-items:center;width:100%;padding:6px var(--sp-3);border:0;background:none;cursor:pointer;text-align:left;font-size:var(--fs-sm)}
  .similar button:hover{background:var(--surface-3)}
  .similar .code{font-weight:700;color:var(--ink-2);flex:none}
  .similar .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drop{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:56px;padding:var(--sp-3);border:1px dashed var(--line-strong);
    border-radius:var(--radius);background:var(--surface-2);color:var(--ink-2);cursor:pointer;font-size:var(--fs-sm);text-align:center}
  .drop:hover,.drop.over{border-color:var(--focus);color:var(--ink)}
  .drop u{text-underline-offset:3px}
  .thumbs{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
  .thumb{position:relative;width:88px;height:66px;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;display:grid;place-items:center;border:0;background:var(--ink);color:var(--surface);cursor:pointer}
  .thumb button .ic{width:12px;height:12px}
  .form-actions{display:flex;gap:var(--sp-2);justify-content:flex-end;padding-top:var(--sp-2)}
  .done{padding-top:var(--sp-5)}
  .done .big{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-4) 0;padding:var(--sp-4);border:1px solid var(--line-strong);background:var(--surface-2)}
  .done .big b{font-size:var(--fs-2xl);font-weight:700;letter-spacing:.02em;flex:1}
  .done .ok{display:inline-flex;align-items:center;gap:var(--sp-2);color:var(--ok);font-weight:700}

  .panel-empty{color:var(--ink-2)}
  .panel-empty h2{font-size:var(--fs-lg);margin-bottom:var(--sp-2);color:var(--ink)}
  .panel-empty ol{margin:var(--sp-3) 0 0;padding-left:1.2em;line-height:1.7}
  .keys{margin-top:var(--sp-5);font-size:var(--fs-sm);color:var(--ink-3);display:grid;grid-template-columns:auto 1fr;gap:6px var(--sp-3)}
  kbd{font:600 var(--fs-xs)/1 var(--font);border:1px solid var(--line-strong);padding:3px 6px;border-radius:2px;color:var(--ink-2);background:var(--surface)}

  /* ---------- News + Jurnal ---------- */
  .reading{width:100%;max-width:820px;margin:0 auto;padding:var(--sp-6) var(--sp-5);overflow:auto}
  #page-news,#page-jurnal{overflow:auto}
  .reading.wide{max-width:1040px}
  .page-head{display:flex;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
  .page-head > div{flex:1}
  .h1{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.01em;font-stretch:108%}
