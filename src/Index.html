<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Extended</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap" rel="stylesheet">
<?!= include('Tokens') ?>
<?!= include('Styles') ?>
</head>
<body>
<?!= include('Icons') ?>
<a class="skip" href="#main">Sari la conținut</a>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><i style="background:var(--z-import)"></i><i style="background:var(--z-interfata)"></i><i style="background:var(--z-date)"></i><i style="background:var(--z-raportare)"></i><i style="background:var(--z-general)"></i><i style="background:var(--z-altul)"></i></span>
    <span class="brand-name">WFM Extended</span>
  </div>
  <nav class="tabs" aria-label="Secțiuni">
    <button class="tab" data-page="tichete" aria-current="page">Tichete</button>
    <button class="tab" data-page="news">News</button>
    <button class="tab" data-page="jurnal" hidden>Jurnal</button>
  </nav>
  <div class="top-actions">
    <button class="btn btn-primary" id="newBtn" title="Tichet nou (N)"><svg class="ic"><use href="#i-plus"/></svg><span>Tichet nou</span></button>
    <div class="admin-wrap">
      <button class="btn btn-quiet" id="adminBtn" aria-haspopup="dialog" aria-expanded="false"><svg class="ic"><use href="#i-lock"/></svg><span id="adminLabel">Admin</span></button>
      <form class="pop" id="adminPop" hidden>
        <label class="lbl" for="pinInput">Codul tău de admin</label>
        <input class="input" type="password" id="pinInput" autocomplete="current-password" required>
        <p class="field-err" id="pinErr" hidden></p>
        <div class="row-end">
          <button type="button" class="btn btn-quiet" id="pinCancel">Renunță</button>
          <button type="submit" class="btn btn-primary" id="pinSubmit">Intră</button>
        </div>
      </form>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- ===== Tichete ===== -->
  <section class="page" id="page-tichete" aria-label="Tichete">
    <div class="zones" id="zones">
      <div class="zone-band" id="zoneBand" aria-hidden="true"></div>
      <div class="zone-row" id="zoneRow" role="group" aria-label="Filtru pe zone"></div>
    </div>

    <div class="work">
      <div class="list-col">
        <div class="toolbar">
          <label class="search">
            <span class="sr">Caută</span>
            <svg class="ic"><use href="#i-search"/></svg>
            <input class="input" id="search" type="search" placeholder="Caută după cod, titlu, nume" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <div class="seg" id="statusSeg" role="group" aria-label="Status"></div>
          <label class="sel-wrap"><span class="sr">Prioritate</span>
            <select class="select" id="prioFilter"></select>
          </label>
          <button class="btn btn-quiet icon-only" id="exportBtn" title="Export CSV" aria-label="Export CSV" hidden><svg class="ic"><use href="#i-download"/></svg></button>
        </div>
        <div class="list-head">
          <div class="list-meta" id="listMeta" aria-live="polite"></div>
          <label class="sort" for="sortSel">Ordine
            <select class="select" id="sortSel">
              <option value="new">Cele mai noi</option>
              <option value="prio">Prioritate</option>
              <option value="upd">Modificate recent</option>
            </select>
          </label>
        </div>
        <div class="list" id="list" role="list"></div>
      </div>

      <aside class="panel" id="panel" aria-label="Detaliu">
        <div class="panel-inner" id="panelInner"></div>
      </aside>
    </div>
  </section>

  <!-- ===== News ===== -->
  <section class="page" id="page-news" aria-label="News" hidden>
    <div class="reading">
      <div class="page-head">
        <h1 class="h1">News</h1>
        <p class="sub">Ce s-a schimbat în WFM Extended.</p>
        <button class="btn btn-primary" id="newsNewBtn" hidden><svg class="ic"><use href="#i-plus"/></svg><span>Anunț nou</span></button>
      </div>
      <div id="newsCompose"></div>
      <div id="newsList"></div>
    </div>
  </section>

  <!-- ===== Jurnal (admin) ===== -->
  <section class="page" id="page-jurnal" aria-label="Jurnal" hidden>
    <div class="reading wide">
      <div class="page-head">
        <h1 class="h1">Jurnal</h1>
        <p class="sub">Ultimele 200 de acțiuni: cine, ce, când.</p>
        <button class="btn btn-quiet" id="journalRefresh"><svg class="ic"><use href="#i-refresh"/></svg><span>Reîncarcă</span></button>
      </div>
      <div id="journal"></div>
    </div>
  </section>
</main>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <span class="lb-name" id="lbName"></span>
    <button class="btn btn-ghost-inv icon-only" id="lbOut" aria-label="Micșorează"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
    <button class="btn btn-ghost-inv icon-only" id="lbIn" aria-label="Mărește"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
    <button class="btn btn-ghost-inv icon-only" id="lbClose" aria-label="Închide"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <img id="lbImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
</div>

<?!= include('App') ?>
</body>
</html>
