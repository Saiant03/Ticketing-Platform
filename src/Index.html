<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Extended</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<?!= include('Tokens') ?>
<?!= include('Styles') ?>
</head>
<body>
<?!= include('Icons') ?>
<a class="skip" href="#main">Sari la conținut</a>

<header class="bar">
  <div class="brand">
    <span class="brand-flaps" id="brandFlaps"></span>
    <span class="brand-name">Extended</span>
  </div>
  <nav class="tabs" aria-label="Secțiuni">
    <button class="tab" data-page="tichete" aria-current="page">Tichete</button>
    <button class="tab" data-page="news">News</button>
    <button class="tab" data-page="jurnal" hidden>Jurnal</button>
  </nav>
  <div class="bar-actions">
    <button class="btn btn-sign" id="newBtn" title="Tichet nou (N)"><svg class="ic"><use href="#i-plus"/></svg><span>Tichet nou</span></button>
    <div class="admin-wrap">
      <button class="btn btn-board" id="adminBtn" aria-haspopup="dialog" aria-expanded="false"><svg class="ic"><use href="#i-lock"/></svg><span id="adminLabel">Admin</span></button>
      <form class="pop" id="adminPop" hidden>
        <label class="lbl" for="pinInput">Codul tău de admin</label>
        <input class="input" type="password" id="pinInput" autocomplete="current-password" required>
        <p class="field-err" id="pinErr" hidden></p>
        <div class="row-end">
          <button type="button" class="btn btn-quiet" id="pinCancel">Renunță</button>
          <button type="submit" class="btn btn-primary" id="pinSubmit">Intră</button>
        </div>
      </form>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- ===== Tichete ===== -->
  <section class="page" id="page-tichete" aria-labelledby="h-tichete">
    <div class="board" id="board">
      <h1 class="sr" id="h-tichete">Tichete</h1>

      <div class="filters">
        <label class="search">
          <span class="sr">Caută</span>
          <svg class="ic"><use href="#i-search"/></svg>
          <input class="input" id="search" type="search" placeholder="Caută după cod, titlu, nume" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="seg" id="statusSeg" role="group" aria-label="Status"></div>
        <label class="sel-wrap"><span class="sr">Ordine</span>
          <select class="select" id="sortSel">
            <option value="new">Cele mai noi</option>
            <option value="prio">Prioritate</option>
            <option value="upd">Modificate recent</option>
          </select>
        </label>
      </div>

      <div class="meta-line">
        <div class="zchips" id="zoneRow" role="group" aria-label="Filtru pe zone"></div>
        <div class="list-meta" id="listMeta" aria-live="polite"></div>
        <label class="sel-wrap"><span class="sr">Prioritate</span>
          <select class="select" id="prioFilter"></select>
        </label>
        <button class="btn btn-board icon-only" id="exportBtn" title="Export CSV" aria-label="Export CSV" hidden><svg class="ic"><use href="#i-download"/></svg></button>
      </div>
      <div class="cols" aria-hidden="true"><span>Cod</span><span>Problemă</span><span>Prio</span><span>Status</span></div>
      <div class="list" id="list" role="list"></div>
    </div>

    <aside class="panel" id="panel" aria-label="Detaliu">
      <div class="panel-inner" id="panelInner"></div>
    </aside>
  </section>

  <!-- ===== News ===== -->
  <section class="page hall-page" id="page-news" aria-labelledby="h-news" hidden>
    <div class="reading">
      <header class="page-head">
        <h1 class="display" id="h-news">News</h1>
        <p class="sub">Ce s-a schimbat în WFM Extended.</p>
        <button class="btn btn-primary" id="newsNewBtn" hidden><svg class="ic"><use href="#i-plus"/></svg><span>Anunț nou</span></button>
      </header>
      <div id="newsCompose"></div>
      <div id="newsList"></div>
    </div>
  </section>

  <!-- ===== Jurnal (admin) ===== -->
  <section class="page hall-page" id="page-jurnal" aria-labelledby="h-jurnal" hidden>
    <div class="reading wide">
      <header class="page-head">
        <h1 class="display" id="h-jurnal">Jurnal</h1>
        <p class="sub">Ultimele 200 de acțiuni: cine, ce, când.</p>
        <button class="btn btn-quiet" id="journalRefresh"><svg class="ic"><use href="#i-refresh"/></svg><span>Reîncarcă</span></button>
      </header>
      <div id="journal"></div>
    </div>
  </section>
</main>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <span class="lb-name" id="lbName"></span>
    <button class="btn btn-board icon-only" id="lbOut" aria-label="Micșorează"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
    <button class="btn btn-board icon-only" id="lbIn" aria-label="Mărește"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
    <button class="btn btn-board icon-only" id="lbClose" aria-label="Închide"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <img id="lbImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
</div>

<?!= include('App') ?>
</body>
</html>
