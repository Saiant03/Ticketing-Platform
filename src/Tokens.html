<style>
  /* Design tokens WFM Extended. Singura sursă pentru culori, tipografie, spațiere. */
  :root{
    color-scheme: light;
    --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;

    --fs-xs: .75rem;   /* 12 */
    --fs-sm: .8125rem; /* 13 */
    --fs-md: .875rem;  /* 14, corp */
    --fs-lg: 1rem;     /* 16 */
    --fs-xl: 1.25rem;  /* 20 */
    --fs-2xl: 1.5rem;  /* 24 */

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    --radius: 3px;
    --header-h: 56px;
    --panel-w: 440px;
    --row-h: 52px;

    --bg: #F2F4F7;
    --surface: #FFFFFF;
    --surface-2: #EBEEF3;
    --surface-3: #E1E6ED;
    --line: #D8DEE6;
    --line-strong: #AEB8C5;
    --ink: #0F1A2B;
    --ink-2: #364559;
    --ink-3: #56657A;
    --sel: #E3ECF8;
    --sel-line: #9DB8DE;

    --primary: #123A6B;
    --primary-hover: #0D2E57;
    --on-primary: #FFFFFF;
    --focus: #1F6FD1;
    --danger: #B42318;
    --danger-soft: #FCE9E7;
    --ok: #16683F;
    --ok-soft: #E3F3EA;

    /* zonele WFM Extended: o culoare + o culoare de glif pentru pictogramă */
    --z-import: #1F7FC8;     --z-import-on: #FFFFFF;
    --z-interfata: #6F4FC2;  --z-interfata-on: #FFFFFF;
    --z-date: #188A50;       --z-date-on: #FFFFFF;
    --z-raportare: #E3A008;  --z-raportare-on: #0F1A2B;
    --z-general: #A3ADB9;    --z-general-on: #0F1A2B;
    --z-altul: #56657A;      --z-altul-on: #FFFFFF;

    --shadow-pop: 0 10px 28px rgba(15,26,43,.16), 0 2px 6px rgba(15,26,43,.08);
    --scrim: rgba(15,26,43,.36);
    --ease: cubic-bezier(.16,1,.3,1);
  }

  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg: #111315;
      --surface: #17191C;
      --surface-2: #1E2125;
      --surface-3: #272B30;
      --line: #2B2F35;
      --line-strong: #464C55;
      --ink: #ECEEF1;
      --ink-2: #BDC2C9;
      --ink-3: #979DA6;
      --sel: #1C2735;
      --sel-line: #3D5A80;

      --primary: #2F6FBF;
      --primary-hover: #3A7DD0;
      --on-primary: #FFFFFF;
      --focus: #6AA8F2;
      --danger: #F0716A;
      --danger-soft: #3A1E1E;
      --ok: #5CC98D;
      --ok-soft: #173123;

      --z-import: #3E9BE2;     --z-import-on: #08121D;
      --z-interfata: #9479DD;  --z-interfata-on: #0D0A18;
      --z-date: #2FB06D;       --z-date-on: #06140C;
      --z-raportare: #F0B323;  --z-raportare-on: #191204;
      --z-general: #98A4B3;    --z-general-on: #0F141B;
      --z-altul: #74839A;      --z-altul-on: #0B1017;

      --shadow-pop: 0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
      --scrim: rgba(0,0,0,.55);
    }
  }
</style>
