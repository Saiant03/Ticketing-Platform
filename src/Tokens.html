<style>
  /* Design tokens WFM Extended, „Panou split-flap”. Singura sursă pentru culori, tipografie, spațiere, mișcare. */
  :root{
    color-scheme: light;
    --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;

    /* lățimi Archivo (axa wdth) */
    --w-plate: 75%;   /* plăcuțe, majuscule */
    --w-title: 85%;   /* titluri de tichet */
    --w-body: 100%;
    --w-sign: 115%;   /* semnalistică */
    --w-wide: 125%;   /* titluri de pagină */

    --fs-xs: .75rem;    /* 12 */
    --fs-sm: .8125rem;  /* 13 */
    --fs-md: .875rem;   /* 14, corp */
    --fs-row: .9375rem; /* 15, titlu de tichet */
    --fs-lg: 1.0625rem; /* 17 */
    --fs-xl: 1.375rem;  /* 22 */
    --fs-2xl: 1.875rem; /* 30 */

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    --radius: 2px;
    --bar-h: 60px;
    --panel-w: 460px;
    --row-h: 56px;

    /* panoul: mereu întunecat, în ambele teme */
    --b-case: #0B0C0E;
    --b-plate: #1A1C20;
    --b-plate-top: #202328;
    --b-split: #050506;
    --b-ink: #F4F4F0;
    --b-ink-2: #A4A8AF;
    --b-ph: #8F949C;
    --b-line: #23262B;
    --b-field: #15171A;
    --b-field-line: #5E636B;
    --b-hover: #15171A;
    --b-sel: #24272C;

    /* semnal (mov pe suprafețe închise) + observații de status */
    --sig: #8A7BFF;
    --sig-h: #A093FF;
    --on-sig: #0B0C0E;
    --st-open: #F4F4F0;
    --st-work: #8A7BFF;
    --st-done: #3DDC84;
    --st-crit: #FF4D3D;

    /* holul, tema light */
    --bg: #F3F4F6;
    --surface: #FFFFFF;
    --surface-2: #E9EBEE;
    --line: #D9DCE1;
    --line-strong: #82888F;
    --ink: #0B0C0E;
    --ink-2: #393D44;
    --ink-3: #5B6068;
    --acc: #6A55E0;
    --acc-h: #5843CF;
    --on-acc: #FFFFFF;
    --focus: #6A55E0;
    --danger: #B42318;
    --danger-soft: #FCE9E7;
    --ok: #12703F;

    --shadow-pop: 0 14px 32px rgba(11,12,14,.18), 0 2px 6px rgba(11,12,14,.10);
    --scrim: rgba(11,12,14,.5);

    --ease: cubic-bezier(.16,1,.3,1);
    --ease-in: cubic-bezier(.55,0,.8,.2);
    --t-panel: 280ms;
  }

  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg: #0E0F11;
      --surface: #16181B;
      --surface-2: #1E2024;
      --line: #2A2D32;
      --line-strong: #666B73;
      --ink: #F2F2EE;
      --ink-2: #C6C8CC;
      --ink-3: #9A9EA5;
      --acc: #8A7BFF;
      --acc-h: #A093FF;
      --on-acc: #0B0C0E;
      --focus: #8A7BFF;
      --danger: #FF6B5E;
      --danger-soft: #34191A;
      --ok: #3DDC84;

      --shadow-pop: 0 16px 36px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35);
      --scrim: rgba(0,0,0,.6);
    }
  }
</style>
