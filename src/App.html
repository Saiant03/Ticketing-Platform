<script>
(function () {
  'use strict';

  // ---------- date de referință ----------
  const ZONES = [
    { key: 'Import', id: 'import' },
    { key: 'Interfață', id: 'interfata' },
    { key: 'Date', id: 'date' },
    { key: 'Raportare', id: 'raportare' },
    { key: 'General', id: 'general' },
    { key: 'Altul', id: 'altul' }
  ];
  const NO_ZONE = { key: '', id: 'none' };
  // inelele hărții: General, Altul și fără zonă stau împreună pe „Altele”
  const RINGS = ['Import', 'Interfață', 'Date', 'Raportare', 'Altele'];
  const STATUSES = { deschis: 'Deschis', in_lucru: 'În lucru', rezolvat: 'Rezolvat' };
  const PRIOS = { scazuta: 'Scăzută', medie: 'Medie', ridicata: 'Ridicată', critica: 'Critică' };
  const PRIO_RANK = { scazuta: 1, medie: 2, ridicata: 3, critica: 4 };
  const NEWS_TYPES = { update: 'Update', fix: 'Fix', anunt: 'Anunț' };
  const MON3 = ['IAN', 'FEB', 'MAR', 'APR', 'MAI', 'IUN', 'IUL', 'AUG', 'SEP', 'OCT', 'NOI', 'DEC'];
  const MAX_FILES = 5;
  const PAGE = 50;
  const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');
  const MOBILE = window.matchMedia('(max-width:900px)');

  const S = {
    page: 'tichete', view: 'map',
    tickets: [], loading: true, loadErr: false, archived: null, archivedLoading: false,
    isAdmin: false, pin: '', adminName: '',
    f: { q: '', status: 'all', prio: 'all', zone: null, sort: 'new' },
    shown: PAGE,
    panel: 'empty', sel: null, createdCode: null, confirm: null, editing: false,
    draft: { reporter: '', title: '', desc: '', zone: '', prio: 'medie', files: [] }, submitting: false, formErr: {},
    cmtDraft: {}, cmtName: '',
    news: [], newsLoaded: false, newsLoading: false, newsErr: false, compose: null, newsConfirm: null,
    journal: null, journalLoading: false,
    thumbs: {}, full: {}, pending: {},
    sig: '', nsig: '', flyNew: null
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  try {
    const p = sessionStorage.getItem('tis_pin'), n = sessionStorage.getItem('tis_admin');
    if (p && n) { S.isAdmin = true; S.pin = p; S.adminName = n; }
    S.draft.reporter = sessionStorage.getItem('tis_reporter') || '';
    S.cmtName = S.draft.reporter;
  } catch (e) {}
  try { const v = localStorage.getItem('tis_view'); if (v === 'map' || v === 'list') S.view = v; else if (MOBILE.matches) S.view = 'list'; } catch (e) { if (MOBILE.matches) S.view = 'list'; }

  // ---------- utilitare ----------
  function gasReady() { return typeof google !== 'undefined' && google.script && google.script.run; }
  function gs(fn, ...args) {
    return new Promise((res, rej) => {
      if (!gasReady()) return rej(new Error('Deschide aplicația prin linkul publicat (…/exec).'));
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const MONTHS = ['ian.', 'feb.', 'mar.', 'apr.', 'mai', 'iun.', 'iul.', 'aug.', 'sept.', 'oct.', 'nov.', 'dec.'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function absDate(ts, withYear) {
    if (!ts) return '';
    const d = new Date(ts), now = new Date();
    const y = (withYear || d.getFullYear() !== now.getFullYear()) ? ' ' + d.getFullYear() : '';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + y + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function relDate(ts) {
    if (!ts) return '';
    const diff = (Date.now() - ts) / 1000;
    if (diff < 60) return 'acum';
    if (diff < 3600) return 'acum ' + Math.floor(diff / 60) + ' min';
    if (diff < 86400) { const h = Math.floor(diff / 3600); return h === 1 ? 'acum o oră' : 'acum ' + h + ' ore'; }
    const d = new Date(ts), y = new Date(); y.setDate(y.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'ieri, ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return absDate(ts);
  }
  function initials(name) {
    const p = String(name || '?').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function zoneOf(t) { return ZONES.find(z => z.key === (t.category || '')) || NO_ZONE; }
  function zoneLabel(z) { return z.key || 'Fără zonă'; }
  function ringIdx(t) { const i = RINGS.indexOf(t.category || ''); return i < 0 ? RINGS.length - 1 : i; }
  function zoneCell(z) { return `<span class="r-zone" data-z="${z.id}">${esc(zoneLabel(z))}</span>`; }
  function stKey(st) { return STATUSES[st] ? st : 'deschis'; }
  function stChip(st) { const k = stKey(st); return `<span class="chip" data-st="${k}">${STATUSES[k]}</span>`; }
  function prioChip(p) { const k = PRIOS[p] ? p : 'medie'; return `<span class="chip${k === 'critica' ? ' crit' : ''}">${PRIOS[k]}</span>`; }
  function prioDots(p) {
    const k = PRIOS[p] ? p : 'medie', r = PRIO_RANK[k];
    let d = '';
    for (let i = 1; i <= 4; i++) d += `<i${i <= r ? ' class="on"' : ''}></i>`;
    return `<span class="pr ${k}" title="Prioritate: ${PRIOS[k]}"><span class="dots" aria-hidden="true">${d}</span><span class="sr">${PRIOS[k]}</span></span>`;
  }
  function icon(id, cls) { return `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#${id}"/></svg>`; }
  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function isToday(d) { return d.toDateString() === new Date().toDateString(); }
  // ora de azi sau data scurtă (03 OCT), pentru Jurnal
  function boardTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return isToday(d) ? hhmm(d) : pad(d.getDate()) + ' ' + MON3[d.getMonth()];
  }
  function findTicket(id) {
    return S.tickets.find(t => t.id === id) || (S.archived || []).find(t => t.id === id) || null;
  }
  function isTyping(el) {
    el = el || document.activeElement;
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  }
  function errMsg(e, fallback) { return (e && e.message) || fallback; }
  function adminErr(e) { return /admin/i.test(errMsg(e, '')); }
  function planetEl(id) { return $(`.planet[data-id="${CSS.escape(id)}"]`); }
  function rowEl(id) { return $(`.row[data-id="${CSS.escape(id)}"]`); }

  // ---------- toast ----------
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'err' ? ' err' : '');
    el.innerHTML = '<span class="t-ic">' + icon(kind === 'err' ? 'i-alert' : 'i-check') + '</span><span class="t-msg">' + esc(msg) + '</span>';
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), kind === 'err' ? 7000 : 3500);
  }

  // ---------- filtrare ----------
  function inStatus(t, st) {
    if (st === 'active') return t.status !== 'rezolvat';
    if (st === 'all' || st === 'archive') return true;
    return t.status === st;
  }
  function matchesQuery(t, q) {
    if (!q) return true;
    const hay = [t.id, t.title, t.reporter, t.desc, t.category].join(' ').toLowerCase();
    return q.split(/\s+/).every(w => hay.indexOf(w) >= 0);
  }
  // tichetele din vederea aleasă (status), înainte de zonă / prioritate / căutare
  function scope() { return (S.f.status === 'archive' ? (S.archived || []) : S.tickets).filter(t => inStatus(t, S.f.status)); }
  function visible() {
    const f = S.f, q = f.q.trim().toLowerCase();
    const out = scope().filter(t =>
      (!f.zone || RINGS[ringIdx(t)] === f.zone) &&
      (f.prio === 'all' || t.priority === f.prio) &&
      matchesQuery(t, q));
    const upd = t => t.updatedAt || t.created || 0;
    if (f.sort === 'prio') out.sort((a, b) => (PRIO_RANK[b.priority] || 0) - (PRIO_RANK[a.priority] || 0) || b.n - a.n);
    else if (f.sort === 'upd') out.sort((a, b) => upd(b) - upd(a));
    else out.sort((a, b) => b.n - a.n);
    return out;
  }
  function filtersActive() { return !!(S.f.q.trim() || S.f.zone || S.f.prio !== 'all' || S.f.status !== 'all'); }
  function resetFilters() {
    S.f = { q: '', status: 'all', prio: 'all', zone: null, sort: S.f.sort };
    $('#search').value = '';
    S.shown = PAGE; renderToolbar(); renderBoard(); zoomSearch();
  }
  function toggleRing(key) {
    S.f.zone = S.f.zone === key ? null : key; S.shown = PAGE;
    renderToolbar(); renderBoard();
  }

  // ---------- banda de filtre ----------
  function renderToolbar() {
    const opts = [['all', 'Toate'], ['active', 'Active'], ['deschis', 'Deschise'], ['in_lucru', 'În lucru'], ['rezolvat', 'Rezolvate']];
    if (S.isAdmin) opts.push(['archive', 'Arhivă']);
    if (!S.isAdmin && S.f.status === 'archive') S.f.status = 'all';
    $('#statusSeg').innerHTML = opts.map(([k, l]) => {
      const n = k === 'archive' ? (S.archived ? S.archived.length : '') : S.tickets.filter(t => inStatus(t, k)).length;
      return `<button data-status="${k}" aria-pressed="${S.f.status === k}">${l}${n !== '' ? ` <span class="n">${n}</span>` : ''}</button>`;
    }).join('');
    const pn = {}; scope().forEach(t => { pn[t.priority] = (pn[t.priority] || 0) + 1; });
    ddSet($('#prioFilter'), [['all', 'Orice prioritate']].concat(Object.keys(PRIOS).reverse().map(k => [k, PRIOS[k], pn[k] || 0])), S.f.prio);
    ddSet($('#zoneSel'), [['', 'Toate zonele']].concat(RINGS.map(r => [r, r])), S.f.zone || '');
    ddSet($('#sortSel'), SORTS, S.f.sort);
    $('#exportBtn').hidden = !S.isAdmin;
    $('#viewMap').setAttribute('aria-pressed', String(S.view === 'map'));
    $('#viewList').setAttribute('aria-pressed', String(S.view === 'list'));
    $('#stage').dataset.view = document.body.dataset.view = S.view;
    $('#search').placeholder = S.view === 'map' ? 'Caută pe hartă…' : 'Caută în listă…';
  }
  // Hartă ↔ Listă trec prin nucleul hărții: harta se apropie de cameră și lista iese din nucleu (invers la întoarcere); doar transform/opacity
  const VX = { busy: false, tok: 0 };
  function rowsIn(list) {
    const rows = $$('.row', list), d = Math.min(24, 300 / rows.length);
    rows.forEach((r, i) => r.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 80 + i * d, fill: 'backwards', easing: 'cubic-bezier(.2,.7,.2,1)' }));
  }
  function setView(v) {
    if (S.view === v) return;
    S.view = v;
    try { localStorage.setItem('tis_view', v); } catch (e) {}
    renderToolbar();
    const map = $('#map'), list = $('#list');
    if (S.page !== 'tichete' || !M.ready) { renderBoard(); return; }
    const tok = ++VX.tok;
    map.getAnimations().forEach(a => a.cancel()); list.getAnimations().forEach(a => a.cancel());
    if (v === 'list') unzoom();
    if (VX.busy) { VX.busy = false; renderBoard(); syncRate(); return; }
    if (REDUCED.matches) { renderBoard(); (v === 'map' ? map : list).animate([{ opacity: 0 }, { opacity: 1 }], 160); return; }
    const o = coreXY(), ease = 'cubic-bezier(.16,1,.3,1)', end = () => tok === VX.tok, done = () => { VX.busy = false; syncRate(); };
    VX.busy = true; syncRate();
    map.style.transformOrigin = list.style.transformOrigin = o;
    if (v === 'list') {
      map.animate([{ transform: 'scale(1)', opacity: 1 }, { offset: 0.6, opacity: 1 }, { transform: 'scale(5)', opacity: 0 }], { duration: 320, easing: 'cubic-bezier(.7,0,.84,0)' }).onfinish = () => {
        if (!end()) return;
        renderBoard();
        list.animate([{ transform: 'scale(.2)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: ease });
        rowsIn(list); done();
      };
    } else {
      list.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.2)', opacity: 0 }], { duration: 260, easing: 'ease-in' }).onfinish = () => {
        if (!end()) return;
        renderBoard();
        map.animate([{ transform: 'scale(.3)', opacity: 0 }, { offset: 0.4, opacity: 1 }, { transform: 'none', opacity: 1 }], { duration: 480, easing: 'ease-out' });
        done();
      };
    }
  }
  function renderMeta() {
    const meta = $('#listMeta');
    if ((S.f.status === 'archive' && S.archivedLoading) || (S.loading && !S.tickets.length)) { meta.textContent = 'Se încarcă…'; return; }
    const n = visible().length;
    meta.innerHTML = `<span>${n} ${n === 1 ? 'rezultat' : 'rezultate'}</span>` + (filtersActive() ? '<button class="linkish" data-clear="all">Resetează filtrele</button>' : '');
  }
  function renderBoard() {
    renderMeta();
    if (S.view === 'map') { $('#list').hidden = true; $('#map').style.display = ''; syncMap(); }
    else { $('#map').style.display = 'none'; $('#mapMsg').hidden = true; S.flyNew = null; renderList(); }
  }

  // ---------- listă ----------
  function rowHtml(t, i) {
    const z = zoneOf(t), nc = (t.comments || []).length, na = (t.attachments || []).length;
    const cur = S.sel === t.id && (S.panel === 'ticket');
    const counts = (nc ? `<span class="r-n" title="${nc} comentarii">${icon('i-comment')}${nc}</span>` : '') + (na ? `<span class="r-n" title="${na} capturi">${icon('i-image')}${na}</span>` : '');
    return `<div role="listitem"><button class="row${t.status === 'rezolvat' ? ' resolved' : ''}" data-id="${esc(t.id)}" data-i="${i}"${cur ? ' aria-current="true"' : ''}>
      <span class="r-code">${esc(t.id)}</span>
      <span class="r-t"><span class="r-title">${esc(t.title)}</span><span class="r-by">${zoneCell(z)} · ${esc(t.reporter)} · ${relDate(t.created)}${counts}</span></span>
      ${prioDots(t.priority)}
      ${stChip(t.status)}
    </button></div>`;
  }
  function emptyBox(title, text, extra) {
    return `<div class="empty"><h3>${title}</h3><p>${text}</p>${extra || ''}</div>`;
  }
  function renderList() {
    const list = $('#list');
    list.hidden = false;
    const archive = S.f.status === 'archive';
    if ((archive && S.archivedLoading) || (!archive && S.loading && !S.tickets.length)) {
      list.setAttribute('aria-busy', 'true');
      list.innerHTML = Array.from({ length: 8 }, () => '<div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>').join('');
      return;
    }
    list.removeAttribute('aria-busy');
    if (!archive && S.loadErr && !S.tickets.length) {
      list.innerHTML = emptyBox('Nu am putut încărca tichetele', 'Verifică conexiunea și încearcă din nou.',
        `<button class="btn btn-ghost" data-act="reload">${icon('i-refresh')}Reîncearcă</button>`);
      return;
    }
    const vis = visible();
    if (!vis.length) {
      if (archive) list.innerHTML = emptyBox('Arhiva e goală', 'Tichetele arhivate apar aici și pot fi restaurate.');
      else if (!S.tickets.length) list.innerHTML = emptyBox('Niciun tichet încă', 'Primul tichet raportat va primi codul TIS-01.',
        `<button class="btn btn-solid" data-act="new">${icon('i-plus')}Tichet nou</button>`);
      else {
        const q = S.f.q.trim();
        list.innerHTML = emptyBox(q ? `Nimic pentru „${esc(q)}”` : 'Niciun tichet pentru filtrele alese', 'Dacă problema nu e raportată încă, deschide un tichet.',
          `<p><button class="linkish" data-clear="all">Resetează filtrele</button></p><button class="btn btn-solid" data-act="new">${icon('i-plus')}Raportează-o</button>`);
      }
      return;
    }
    const fa = document.activeElement, fid = fa && fa.classList && fa.classList.contains('row') && list.contains(fa) ? fa.dataset.id : null;
    const slice = vis.slice(0, S.shown);
    list.innerHTML = slice.map(rowHtml).join('') +
      (vis.length > slice.length ? `<button class="more" data-act="more">Arată încă ${Math.min(PAGE, vis.length - slice.length)} din ${vis.length - slice.length} rămase</button>` : '') +
      '<div class="list-end"><span>Nu găsești problema?</span><button class="linkish" data-act="new">Raportează-o</button>' +
      '<span class="keys-inline"><kbd>N</kbd> tichet nou <kbd>J</kbd> <kbd>K</kbd> navighează <kbd>/</kbd> caută</span></div>';
    if (fid) { const r = rowEl(fid); if (r) r.focus({ preventScroll: true }); }
  }

  // ---------- cardul de detaliu ----------
  function setPanel(mode, id) {
    S.panel = mode; S.confirm = null; S.editing = false;
    if (id !== undefined) S.sel = id;
    renderPanel(); renderBoard();
  }
  function closePanel() {
    const id = S.sel;
    setPanel('empty', null);
    const el = id && (S.view === 'map' ? planetEl(id) : rowEl(id));
    if (el) el.focus();
  }
  // cardul glisează din dreapta; conținutul se golește abia după ieșire
  function syncCard() {
    const open = S.panel !== 'empty';
    $('#panel').classList.toggle('open', open);
    document.body.classList.toggle('card-open', open);
    camera(); syncRate();
    clearTimeout(S.clr);
    if (!open) S.clr = setTimeout(() => { if (S.panel === 'empty') $('#panelInner').innerHTML = ''; }, 500);
  }

  function renderPanel() {
    const box = $('#panelInner');
    if (S.panel === 'ticket' && !findTicket(S.sel)) S.panel = 'empty';
    if (S.panel === 'new') box.innerHTML = newFormHtml();
    else if (S.panel === 'created') box.innerHTML = createdHtml();
    else if (S.panel === 'ticket') { box.innerHTML = ticketHtml(findTicket(S.sel)); hydrate(box); }
    if (S.panel === 'new') wireNewForm();
    syncCard();
  }

  function ticketHtml(t) {
    const z = zoneOf(t), archived = !!t.archived;
    const top = `<div class="p-top">
      <button class="btn-circle sm p-back" data-act="close" aria-label="Înapoi la listă">${icon('i-back')}</button>
      <span class="p-code">${esc(t.id)}</span>
      <button class="btn btn-ghost sm p-copy" data-act="copy" data-code="${esc(t.id)}" aria-label="Copiază codul ${esc(t.id)}" title="Copiază codul">Copiază</button>
      <button class="btn-circle sm p-x" data-act="close" aria-label="Închide detaliul" title="Închide (Esc)">${icon('i-close')}</button>
    </div>`;
    const titleBlock = S.editing
      ? `<form class="edit" data-form="edit">
          <div class="field"><label class="lbl" for="ed-title">Titlu</label><input class="input" id="ed-title" maxlength="200" value="${esc(t.title)}" required></div>
          <div class="field"><label class="lbl" for="ed-desc">Descriere</label><textarea class="textarea" id="ed-desc" rows="6" maxlength="4000">${esc(t.desc)}</textarea></div>
          <div class="form-actions"><button type="button" class="btn btn-ghost" data-act="edit-cancel">Anulează</button><button type="submit" class="btn btn-solid">Salvează</button></div>
        </form>`
      : `<h2 class="p-title" id="p-title" tabindex="-1">${esc(t.title)}</h2>`;
    const chips = `<div class="chips">${prioChip(t.priority)}${stChip(t.status)}<span class="chip">${esc(zoneLabel(z))}</span>${archived ? '<span class="chip">Arhivat</span>' : ''}</div>`;
    const who = `<div class="who"><span class="avatar" aria-hidden="true">${esc(initials(t.reporter))}</span><span>Raportat de <b>${esc(t.reporter)}</b></span><time title="${esc(absDate(t.created, true))}">${relDate(t.created)}</time></div>` +
      (t.updatedBy ? `<p class="hint upd">Modificat de ${esc(t.updatedBy)} · <span title="${esc(absDate(t.updatedAt, true))}">${relDate(t.updatedAt)}</span></p>` : '');
    const desc = S.editing ? '' : `<div class="p-section"><h3 class="cap">Descriere</h3>${t.desc ? `<div class="desc">${esc(t.desc)}</div>` : '<p class="desc none">Fără descriere.</p>'}</div>`;
    const shots = (t.attachments || []).length ? `<div class="p-section"><h3 class="cap">Capturi <span class="n">${t.attachments.length}</span></h3>${shotsHtml(t.attachments)}</div>` : '';
    return top + titleBlock + chips + who + (S.isAdmin ? adminBoxHtml(t) : '') + desc + shots + (archived ? '' : commentsHtml(t));
  }

  function adminBoxHtml(t) {
    if (t.archived) {
      return `<div class="admin-box"><div class="full admin-actions">
        <button class="btn btn-ghost" data-act="restore">${icon('i-restore')}Restaurează</button>
        <button class="btn btn-danger-ghost" data-act="purge-ask">${icon('i-trash')}Șterge definitiv</button></div>
        ${S.confirm === 'purge' ? `<div class="full confirm"><span>Ștergi definitiv ${esc(t.id)} și capturile lui? Nu se mai poate recupera.</span>
          <button class="btn btn-ghost" data-act="confirm-cancel">Anulează</button><button class="btn btn-danger" data-act="purge">Șterge definitiv</button></div>` : ''}
      </div>`;
    }
    const seg = Object.keys(STATUSES).map(k =>
      `<button data-set-status="${k}" aria-pressed="${t.status === k}">${STATUSES[k]}</button>`).join('');
    const po = DD.opts['ad-prio'] = Object.keys(PRIOS).map(k => [k, PRIOS[k]]);
    const zo = DD.opts['ad-zone'] = [['', 'Fără zonă']].concat(ZONES.map(z => [z.key, z.key]));
    const pv = t.priority || '', zv = t.category || '';
    return `<div class="admin-box">
      <div class="full"><span class="lbl" id="lbl-st">Status</span><div class="seg" role="group" aria-labelledby="lbl-st">${seg}</div></div>
      <div><span class="lbl" id="lbl-ad-prio">Prioritate</span><button type="button" class="select dd" id="ad-prio" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="lbl-ad-prio ad-prio" value="${esc(pv)}">${ddLabel(po, pv)}</button></div>

      .sort((a, b) => b.s - a.s || (a.t.status === 'rezolvat') - (b.t.status === 'rezolvat'))

  // ---------- fișiere ----------
  function compress(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = () => rej(new Error('Nu am putut citi imaginea.'));
      r.onload = () => {
        const img = new Image();
        img.onerror = () => rej(new Error('Fișierul nu e o imagine validă.'));
        img.onload = () => {
          let w = img.width, h = img.height; const max = 1600;
          if (w > max) { h = Math.round(h * max / w); w = max; }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
          res({ dataUrl: c.toDataURL('image/jpeg', 0.85), name: (file.name || 'captura').replace(/\.[^.]+$/, '') + '.jpg' });
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  function addFiles(arr, list, done) {
    let files = Array.from(list || []).filter(f => /^image\//.test(f.type));
    if (!files.length) return;
    const room = MAX_FILES - arr.length;
    if (room <= 0) { toast('Poți atașa cel mult ' + MAX_FILES + ' capturi.', 'err'); return; }
    if (files.length > room) { toast('Am păstrat primele ' + room + ' imagini (maxim ' + MAX_FILES + ').', 'err'); files = files.slice(0, room); }
    files.forEach(f => compress(f).then(r => { arr.push(r); done(); }).catch(e => toast(errMsg(e, 'Imagine invalidă.'), 'err')));
  }
  function wireDrop(dz, input, onFiles) {
    if (!dz) return;
    dz.addEventListener('click', () => input.click());
    dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', () => { onFiles(input.files); input.value = ''; });
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); onFiles(e.dataTransfer.files); });
  }
  function uploadAll(files, progressEl) {
    const out = [];
    return files.reduce((p, f, i) => p.then(() => {
      if (progressEl) progressEl.textContent = `Se încarcă captura ${i + 1} din ${files.length}…`;
      return gs('uploadAttachment', f.dataUrl.split(',')[1], 'image/jpeg', f.name).then(r => { out.push(r); });
    }), Promise.resolve()).then(() => out);
  }

  // ---------- imagini ----------
  function loadThumb(id) {
    if (S.thumbs[id]) return Promise.resolve(S.thumbs[id]);
    if (S.pending['t' + id]) return S.pending['t' + id];
    const p = gs('getAttachmentThumb', id).catch(() => gs('getAttachment', id))
      .then(r => { const u = 'data:' + r.mime + ';base64,' + r.data; S.thumbs[id] = u; return u; })
      .finally(() => { delete S.pending['t' + id]; });
    return (S.pending['t' + id] = p);
  }
  function loadFull(id) {
    if (S.full[id]) return Promise.resolve(S.full[id]);
    return gs('getAttachment', id).then(r => (S.full[id] = 'data:' + r.mime + ';base64,' + r.data));
  }
  function hydrate(root) {
    $$('img[data-thumb]', root).forEach(img => {
      loadThumb(img.dataset.thumb).then(u => { img.src = u; img.classList.add('ready'); }).catch(() => {});
    });
  }

  // ---------- acțiuni server ----------
  // cache local (aceleași date pentru toți): la pornire harta apare din el, apoi răspunsul serverului o actualizează
  function cacheGet(k) { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : null; } catch (e) { return null; } }
  function cacheSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(quiet) {
    if (!gasReady()) { S.loading = false; S.loadErr = true; renderAll(); toast('Deschide aplicația prin linkul publicat (…/exec).', 'err'); return; }
    if (!quiet) { S.loading = true; renderBoard(); }
    gs('getTickets').then(list => {
      list = list || []; cacheSet('tis_cache_t', list);
      const same = quiet && !S.loading && !S.loadErr && vsig(list) === vsig(S.tickets);
      S.tickets = list; S.loading = false; S.loadErr = false; S.sig = sig(list);
      if (!same) renderAll();
    }).catch(() => { S.loading = false; S.loadErr = true; renderBoard(); toast('Nu am putut încărca tichetele.', 'err'); });
  }
  function sig(list) { return list.map(t => [t.id, t.status, t.priority, t.category, t.updatedAt || 0, (t.comments || []).length, t.title].join(':')).join('|'); }
  // ce se vede pe hartă și în card (fără ora modificării)
  function vsig(list) { return list.map(t => [t.id, t.status, t.priority, t.category, t.title, t.desc, (t.comments || []).length].join(':')).join('|'); }
  function loadArchived() {
    S.archivedLoading = true; renderBoard();
    gs('getArchived', S.pin).then(list => { S.archived = list || []; S.archivedLoading = false; renderToolbar(); renderBoard(); })
      .catch(e => { S.archivedLoading = false; S.f.status = 'all'; renderToolbar(); renderBoard(); toast(errMsg(e, 'Nu am putut încărca arhiva.'), 'err'); if (adminErr(e)) logout(); });
  }

  function submitNew() {
    const d = S.draft, e = {};
    d.reporter = d.reporter.trim(); d.title = d.title.trim();
    if (!d.reporter) e.reporter = 'Scrie numele tău, ca adminii să știe pe cine întreabă.';
    if (!d.title) e.title = 'Scrie pe scurt ce nu merge.';
    S.formErr = e;
    if (e.reporter || e.title) { renderPanel(); $(e.reporter ? '#nf-reporter' : '#nf-title').focus(); return; }
    S.submitting = true; renderPanel();
    uploadAll(d.files.slice(), $('#nf-progress'))
      .then(atts => { $('#nf-progress').textContent = 'Se salvează…'; return gs('addTicket', { reporter: d.reporter, title: d.title, desc: d.desc.trim(), priority: d.prio, category: d.zone, attachments: atts }); })
      .then(res => {
        try { sessionStorage.setItem('tis_reporter', d.reporter); } catch (x) {}
        S.cmtName = S.cmtName || d.reporter;
        S.tickets = res.tickets; S.sig = sig(S.tickets);
        S.draft = { reporter: d.reporter, title: '', desc: '', zone: '', prio: 'medie', files: [] };
        S.submitting = false; S.createdCode = res.code; S.flyNew = res.code; S.formErr = {};
        renderToolbar(); setPanel('created');
      })
      .catch(err => { S.submitting = false; S.formErr = { form: errMsg(err, 'Tichetul nu s-a salvat. Încearcă din nou.') }; renderPanel(); });
  }

  function adminCall(fn, args, apply, rollback, okMsg) {
    if (!S.isAdmin) return toast('Doar adminii pot face asta.', 'err');
    apply(); renderAll();
    gs(fn, ...args, S.pin).then(list => {
      if (fn === 'restoreTicket' || fn === 'purgeTicket') { S.archived = list; load(true); renderAll(); }
      else { const same = vsig(list) === vsig(S.tickets); S.tickets = list; S.sig = sig(list); if (!same) renderAll(); }
      if (okMsg) toast(okMsg);
    }).catch(e => { rollback(); renderAll(); toast(errMsg(e, 'Acțiunea nu a reușit.'), 'err'); if (adminErr(e)) logout(); });
  }
  function setField(t, key, val, fn, args, msg) {
    const prev = t[key];
    adminCall(fn, args, () => { t[key] = val; t.updatedBy = S.adminName; t.updatedAt = Date.now(); }, () => { t[key] = prev; }, msg);
  }

  function sendComment(form) {
    const t = findTicket(S.sel); if (!t) return;
    const text = $('#cm-text', form).value.trim(), nameEl = $('#cm-name', form), name = nameEl ? nameEl.value.trim() : '';
    const err = $('#cm-err', form);
    const fail = (m, el) => { err.textContent = m; err.hidden = false; el.focus(); };
    if (!S.isAdmin && !name) return fail('Scrie numele tău.', nameEl);
    if (!text) return fail('Comentariul e gol.', $('#cm-text', form));
    if (!S.isAdmin) { S.cmtName = name; try { sessionStorage.setItem('tis_reporter', name); } catch (x) {} }
    const c = { author: S.isAdmin ? S.adminName : name, admin: S.isAdmin, text, at: Date.now() };
    t.comments = (t.comments || []).concat([c]); S.cmtDraft[t.id] = '';

    gs('addComment', t.id, text, S.isAdmin ? '' : name, S.isAdmin ? S.pin : '')
      .then(list => { S.tickets = list; S.sig = sig(list); renderAll(); })
      .catch(e => { t.comments = t.comments.filter(x => x !== c); S.cmtDraft[t.id] = text; renderPanel(); toast(errMsg(e, 'Comentariul nu s-a trimis.'), 'err'); });
  }

  // ultimul anunț, ca ticker sub hartă
  function renderTicker() {

  function renderNews() {
    renderTicker();

  // ---------- harta „Orbită” ----------

  });

  // unghiul curent al inelului i (rad): din animația lui

  // --- fundal: stele ---
  // 3 straturi de adâncime (f mic = departe), fiecare desenat o singură dată pe un canvas din afara paginii și pus ca imagine de fundal

    L: [{ n: 95, r: 0.55, a: 0.45, f: 0.25 }, { n: 45, r: 0.85, a: 0.65, f: 0.55 }, { n: 22, r: 1.35, a: 0.95, f: 1 }].map((l, i) => {
      l.w = $$('#stars .sl')[i]; l.c = $('i', l.w); l.x = document.createElement('canvas').getContext('2d'); l.pad = Math.ceil(170 * l.f) + 8;   // surplus: derivă + paralaxă + cameră
      l.s = Array.from({ length: l.n }, () => ({ u: Math.random(), v: Math.random(), r: l.r * (0.8 + Math.random() * 0.4), a: l.a * (0.6 + Math.random() * 0.4) }));
      return l;
    }) };
  function sizeStars() {
    const d = Math.min(window.devicePixelRatio || 1, 1.5);
    ST.w = window.innerWidth; ST.h = window.innerHeight;
    ST.L.forEach(l => {
      const w = ST.w + 2 * l.pad, h = ST.h + 2 * l.pad, c = l.c, x = l.x, cv = x.canvas;
      cv.width = Math.round(w * d); cv.height = Math.round(h * d);
      c.style.width = w + 'px'; c.style.height = h + 'px'; c.style.left = c.style.top = -l.pad + 'px';
      x.setTransform(d, 0, 0, d, 0, 0); x.fillStyle = '#fff';
      l.s.forEach(s => { x.globalAlpha = s.a; x.beginPath(); x.arc(s.u * w, s.v * h, s.r, 0, TAU); x.fill(); });
      cv.toBlob(b => { const u = URL.createObjectURL(b); c.style.backgroundImage = 'url(' + u + ')'; if (l.u) URL.revokeObjectURL(l.u); l.u = u; });
    });

    const f = l.f, p = (x, y) => 'translate(' + x * f + 'px,' + y * f + 'px)';

  });
  // paralaxa (max 12px pe stratul apropiat) + camera dintre pagini (70px pe pagină): tranziție CSS pe wrapper
  function moveStars() {
    if (!REDUCED.matches) ST.L.forEach(l => { l.w.style.transform = 'translate(' + ((ST.px + ST.cx) * l.f).toFixed(1) + 'px,' + (ST.py * l.f).toFixed(1) + 'px)'; });
  }
  // stea căzătoare, rar: WAAPI, programată la 8–15 s, doar cât pagina e vizibilă și activă

    setTimeout(() => {
      shootLater();
      if (document.hidden || M.paused || REDUCED.matches) return;
      const x = Math.random() * ST.w * 0.7, y = Math.random() * ST.h * 0.35, a = (0.5 + Math.random() * 0.4).toFixed(2), at = (px, py) => 'translate(' + px.toFixed(0) + 'px,' + py.toFixed(0) + 'px) rotate(' + a + 'rad)';

  // --- geometrie ---
  // Un singur R (cel mai mic dintre cardul închis și deschis): la deschiderea cardului se mută doar camera.

    const rad = f => Math.max(110, Math.min(avail / 2 - 40, f / 2 - side - 20));

      case 'copy': {
        const code = ds.code, ok = () => { toast('Codul ' + code + ' a fost copiat.'); copied(t); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, () => fallbackCopy(code, ok)); else fallbackCopy(code, ok);
        return;
      }
      case 'edit': S.editing = true; renderPanel(); $('#ed-title').focus(); return;
      case 'edit-cancel': S.editing = false; return renderPanel();
      case 'archive-ask': S.confirm = 'archive'; return renderPanel();
      case 'purge-ask': S.confirm = 'purge'; return renderPanel();
      case 'confirm-cancel': S.confirm = null; return renderPanel();
      case 'archive': {
        const prevList = S.tickets.slice();
        S.panel = 'empty';
        return adminCall('deleteTicket', [cur.id], () => { S.tickets = S.tickets.filter(x => x !== cur); }, () => { S.tickets = prevList; }, cur.id + ' arhivat.');
      }
      case 'restore':
        S.panel = 'empty';
        return adminCall('restoreTicket', [cur.id], () => { S.archived = S.archived.filter(x => x !== cur); }, () => { S.archived.push(cur); }, cur.id + ' restaurat.');
      case 'purge': {
        const prev = S.archived.slice();
        S.panel = 'empty';
        return adminCall('purgeTicket', [cur.id], () => { S.archived = S.archived.filter(x => x !== cur); }, () => { S.archived = prev; }, cur.id + ' șters definitiv.');
      }
      case 'compose-cancel': S.compose = null; return renderNews();
    }
  });
  // butonul de copiere: „Copiat” 2 s, apoi revine
  function copied(btn) {
    btn.textContent = 'Copiat';
    clearTimeout(btn._ct);
    btn._ct = setTimeout(() => { if (btn.isConnected) btn.textContent = 'Copiază'; }, 2200);
  }
  function fallbackCopy(text, ok) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove();
  }

  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.id === 'pinForm') return login(e);
    e.preventDefault();
    if (f.id === 'newForm') return submitNew();
    if (f.id === 'composeForm') return publish();
    if (f.dataset.form === 'comment') return sendComment(f);
    if (f.dataset.form === 'edit') {
      const t = findTicket(S.sel), title = $('#ed-title').value.trim(), desc = $('#ed-desc').value.trim();
      if (!title) { $('#ed-title').setAttribute('aria-invalid', 'true'); $('#ed-title').focus(); return; }
      const prev = { title: t.title, desc: t.desc };
      S.editing = false;
      adminCall('editTicket', [t.id, { title, desc }], () => { t.title = title; t.desc = desc; t.updatedBy = S.adminName; t.updatedAt = Date.now(); }, () => { t.title = prev.title; t.desc = prev.desc; }, 'Tichet actualizat.');
    }
  });

  document.addEventListener('change', e => {
    const el = e.target, t = findTicket(S.sel);
    if (el.id === 'prioFilter') { S.f.prio = el.value; S.shown = PAGE; return renderBoard(); }
    if (el.id === 'zoneSel') { S.f.zone = el.value || null; S.shown = PAGE; return renderBoard(); }
    if (el.id === 'sortSel') { S.f.sort = el.value; return renderBoard(); }
    if (el.id === 'ad-prio' && t) return setField(t, 'priority', el.value, 'updatePriority', [t.id, el.value], 'Prioritate: ' + PRIOS[el.value] + '.');
    if (el.id === 'ad-zone' && t) return setField(t, 'category', el.value, 'editTicket', [t.id, { category: el.value }], 'Zonă: ' + (el.value || 'fără zonă') + '.');
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'search') { S.f.q = e.target.value; S.shown = PAGE; renderBoard(); syncRate(); clearTimeout(S.zt); S.zt = setTimeout(zoomSearch, 250); }
    if (e.target.id === 'cm-text' && S.sel) S.cmtDraft[S.sel] = e.target.value;
    if (e.target.id === 'cm-name') S.cmtName = e.target.value;
  });

  document.addEventListener('keydown', e => {
    if (!$('#lightbox').hidden) { if (e.key === 'Escape') closeLightbox(); return; }
    if (e.target.classList && e.target.classList.contains('dd') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); return ddOpen(e.target); }
    if (e.key === 'Enter' && e.target.id === 'search') { const t = S.f.q.trim() && visible()[0]; if (t) openTicket(t.id); return; }
    const ctl = e.target.closest && e.target.closest('.planet, .rz');
    if (ctl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ctl.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.tagName === 'TEXTAREA') {
      const f = e.target.closest('form'); if (f) { e.preventDefault(); f.requestSubmit(); } return;
    }
    if (e.key === 'Escape') {
      if (!$('#adminPop').hidden) { openPop(false); $('#adminBtn').focus(); return; }
      if (S.confirm) { S.confirm = null; renderPanel(); return; }
      if (e.target.id === 'search' && S.f.q) { e.target.value = ''; S.f.q = ''; clearTimeout(S.zt); renderBoard(); zoomSearch(); return; }
      if (S.panel !== 'empty' && S.page === 'tichete') { closePanel(); return; }
      return;
    }
    if (isTyping(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (S.page !== 'tichete') return;
    if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNew(); }
    else if (e.key === 'j') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'k') { e.preventDefault(); moveSel(-1); }
  });

  document.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items; if (!items) return;
    const imgs = Array.from(items).filter(i => i.type.indexOf('image') === 0).map(i => i.getAsFile()).filter(Boolean);
    if (!imgs.length) return;
    if (S.page === 'news' && S.compose && !S.compose.id) { e.preventDefault(); addFiles(S.compose.files, imgs, () => { $('#nw-thumbs').innerHTML = thumbsHtml(S.compose.files); }); return; }
    if (S.page !== 'tichete') return;
    e.preventDefault();
    if (S.panel !== 'new') openNew();
    addFiles(S.draft.files, imgs, () => { const th = $('#nf-thumbs'); if (th) th.innerHTML = thumbsHtml(S.draft.files); });
  });


  // ---------- meniu derulant ----------
  // un singur listbox (#ddList) pentru toate butoanele .dd; DD.opts[id] = [[valoare, text, număr?], …]
  const SORTS = [['new', 'Cele mai noi'], ['prio', 'Prioritate'], ['upd', 'Modificate recent']];
  const DD = { opts: {}, id: null, i: 0 };
  const ddNorm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  function ddLabel(opts, val) {
    const o = opts.find(a => a[0] === val) || opts[0];
    return esc(o[1]) + (o[2] != null ? ` <span class="n">${esc(o[2])}</span>` : '');
  }
  function ddSet(el, opts, val) { DD.opts[el.id] = opts; el.value = val; el.innerHTML = ddLabel(opts, val); }
  function ddOpen(btn) {
    const L = $('#ddList'), o = DD.opts[btn.id] || [];
    DD.id = btn.id; DD.i = Math.max(0, o.findIndex(a => a[0] === btn.value));
    L.innerHTML = o.map(([v, x, n], i) => `<div role="option" id="ddo-${i}" class="dd-o" aria-selected="${v === btn.value}" data-i="${i}"><span>${esc(x)}</span>${n != null ? `<span class="n">${n}</span>` : ''}</div>`).join('');
    L.setAttribute('aria-labelledby', btn.getAttribute('aria-labelledby'));
    btn.setAttribute('aria-expanded', 'true');
    // poziție: sub buton, sau deasupra dacă dedesubt e prea puțin loc
    const r = btn.getBoundingClientRect(), w = Math.min(320, innerWidth - 32), below = innerHeight - r.bottom - 22, up = below < 200 && r.top > below;
    L.style.cssText = `min-width:${r.width}px;max-width:${w}px;left:0;max-height:${Math.min(320, up ? r.top - 22 : below)}px;` + (up ? `bottom:${innerHeight - r.top + 6}px;top:auto;transform-origin:bottom` : `top:${r.bottom + 6}px;transform-origin:top`);
    L.hidden = false;
    L.style.left = Math.max(16, Math.min(r.left, innerWidth - 16 - L.offsetWidth)) + 'px';
    const dy = up ? '6px' : '-6px';
    L.animate(REDUCED.matches ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: `translateY(${dy}) scale(.98)` }, { opacity: 1, transform: 'none' }], { duration: 160, easing: 'cubic-bezier(.16,1,.3,1)' });
    L.focus({ preventScroll: true });
    ddActive(DD.i);
  }
  function ddActive(i) {
    const L = $('#ddList'), os = $$('.dd-o', L);
    if (!os.length) return;
    i = DD.i = Math.max(0, Math.min(os.length - 1, i));
    os.forEach((el, k) => el.classList.toggle('on', k === i));
    L.setAttribute('aria-activedescendant', 'ddo-' + i);
    os[i].scrollIntoView({ block: 'nearest' });
  }
  function ddClose(focus) {
    const b = DD.id && document.getElementById(DD.id);
    $('#ddList').hidden = true;
    if (b) { b.setAttribute('aria-expanded', 'false'); if (focus) b.focus(); }
    DD.id = null;
  }
  function ddPick(i) {
    const id = DD.id, b = document.getElementById(id), o = DD.opts[id], v = o[i][0];
    ddClose(true);
    if (b && v !== b.value) {
      ddSet(b, o, v); b.dispatchEvent(new Event('change', { bubbles: true }));
      const nb = document.getElementById(id);   // renderAll poate recrea butonul (ad-*)
      if (nb && document.activeElement !== nb) nb.focus();
    }
  }
  (function wireDropdown() {
    const L = $('#ddList');
    L.addEventListener('keydown', e => {
      const k = e.key, n = (DD.opts[DD.id] || []).length;
      if (k === 'ArrowDown') ddActive(DD.i + 1);
      else if (k === 'ArrowUp') ddActive(DD.i - 1);
      else if (k === 'Home') ddActive(0);
      else if (k === 'End') ddActive(n - 1);
      else if (k === 'Enter' || k === ' ') ddPick(DD.i);
      else if (k === 'Escape') ddClose(true);
      else if (k === 'Tab') ddClose(true);
      else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        for (let j = 1; j <= n; j++) { const x = (DD.i + j) % n; if (ddNorm(DD.opts[DD.id][x][1])[0] === ddNorm(k)) { ddActive(x); break; } }
      } else return;
      e.preventDefault(); e.stopPropagation();
    });
    L.addEventListener('click', e => { const o = e.target.closest('.dd-o'); if (o) ddPick(+o.dataset.i); });
    L.addEventListener('pointermove', e => { const o = e.target.closest('.dd-o'); if (o && +o.dataset.i !== DD.i) ddActive(+o.dataset.i); });
    document.addEventListener('pointerdown', e => { if (DD.id && !e.target.closest('#ddList, #' + DD.id)) ddClose(true); }, true);
    window.addEventListener('resize', () => { if (DD.id) ddClose(false); });
    window.addEventListener('scroll', e => { if (DD.id && e.target !== L) ddClose(false); }, true);
  })();

  // ---------- lightbox ----------
  const LB = { s: 1, x: 0, y: 0, drag: false, sx: 0, sy: 0, ox: 0, oy: 0, ptr: {}, pd: 0, ps: 1, ret: null };
  function lbApply() { const img = $('#lbImg'); img.style.transform = `translate(${LB.x}px,${LB.y}px) scale(${LB.s})`; img.classList.toggle('zoomed', LB.s > 1.01); }
  function lbReset() { LB.s = 1; LB.x = 0; LB.y = 0; lbApply(); }
  function lbZoom(ns, cx, cy) {
    ns = Math.max(1, Math.min(6, ns));
    const r = $('#lbImg').getBoundingClientRect(), mx = r.left + r.width / 2, my = r.top + r.height / 2;
    const ox = (cx == null ? mx : cx) - mx, oy = (cy == null ? my : cy) - my;
    LB.x = ox - ns * (ox - LB.x) / LB.s; LB.y = oy - ns * (oy - LB.y) / LB.s; LB.s = ns;
    if (LB.s <= 1.001) { LB.s = 1; LB.x = 0; LB.y = 0; }
    lbApply();
  }
  function openLightbox(id, name) {
    LB.ret = document.activeElement;
    const lb = $('#lightbox'), img = $('#lbImg');
    lbReset(); img.src = S.full[id] || S.thumbs[id] || BLANK; img.alt = 'Captură: ' + (name || '');
    $('#lbName').textContent = name || '';
    lb.hidden = false; $('#lbClose').focus();
    loadFull(id).then(u => { img.src = u; }).catch(() => toast('Captura nu s-a putut încărca.', 'err'));
  }
  function closeLightbox() { $('#lightbox').hidden = true; lbReset(); if (LB.ret) LB.ret.focus(); }
  (function wireLightbox() {
    const lb = $('#lightbox'), img = $('#lbImg');
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    img.addEventListener('dblclick', e => { if (LB.s > 1) lbReset(); else lbZoom(2.5, e.clientX, e.clientY); });
    img.addEventListener('wheel', e => { e.preventDefault(); lbZoom(LB.s * (e.deltaY < 0 ? 1.15 : 0.87), e.clientX, e.clientY); }, { passive: false });
    img.addEventListener('pointerdown', e => {
      img.setPointerCapture(e.pointerId); LB.ptr[e.pointerId] = { x: e.clientX, y: e.clientY };
      const ids = Object.keys(LB.ptr);
      if (ids.length === 2) { const a = LB.ptr[ids[0]], b = LB.ptr[ids[1]]; LB.pd = Math.hypot(a.x - b.x, a.y - b.y); LB.ps = LB.s; }
      else if (LB.s > 1) { LB.drag = true; LB.sx = e.clientX; LB.sy = e.clientY; LB.ox = LB.x; LB.oy = LB.y; img.classList.add('drag'); }
    });
    img.addEventListener('pointermove', e => {
      if (!LB.ptr[e.pointerId]) return;
      LB.ptr[e.pointerId] = { x: e.clientX, y: e.clientY };
      const ids = Object.keys(LB.ptr);
      if (ids.length === 2) { const a = LB.ptr[ids[0]], b = LB.ptr[ids[1]]; if (LB.pd > 0) lbZoom(LB.ps * Math.hypot(a.x - b.x, a.y - b.y) / LB.pd, (a.x + b.x) / 2, (a.y + b.y) / 2); }
      else if (LB.drag) { LB.x = LB.ox + e.clientX - LB.sx; LB.y = LB.oy + e.clientY - LB.sy; lbApply(); }
    });
    const up = e => { delete LB.ptr[e.pointerId]; if (Object.keys(LB.ptr).length < 2) { LB.drag = false; img.classList.remove('drag'); } };
    img.addEventListener('pointerup', up); img.addEventListener('pointercancel', up);
  })();

  // ---------- reîmprospătare automată ----------
  setInterval(() => {
    if (document.hidden || !gasReady()) return;
    if (S.page === 'tichete' && !S.loading && !S.submitting) {
      gs('getTickets').then(list => {
        cacheSet('tis_cache_t', list || []);
        const s = sig(list || []); if (s === S.sig) return;
        S.tickets = list; S.sig = s;
        renderToolbar(); renderBoard();
        const inPanel = $('#panel').contains(document.activeElement) && isTyping();
        if (S.panel === 'ticket' && !S.editing && !inPanel) renderPanel();
      }).catch(() => {});
    } else if (S.page === 'news' && S.newsLoaded && !S.compose) {
      gs('getNews').then(list => { cacheSet('tis_cache_n', list || []); const s = nsig(list || []); if (s !== S.nsig) { S.news = list; S.nsig = s; renderNews(); } }).catch(() => {});
    }
  }, 20000);

  // ---------- start ----------
  document.body.dataset.page = S.page;
  const ct = cacheGet('tis_cache_t'), cn = cacheGet('tis_cache_n');
  if (ct) { S.tickets = ct; S.loading = false; S.sig = sig(ct); }
  if (cn) { S.news = cn; S.nsig = nsig(cn); }
  sizeStars();
  renderAll(); renderTicker();
  load(!!ct);
  loadNews();   // ticker-ul de sub hartă
  // fonturile vin după prima afișare: re-măsoară titlurile etichetelor
  document.fonts.addEventListener('loadingdone', () => { M.p.forEach(p => { p.key = ''; }); if (S.view === 'map' && S.page === 'tichete') syncMap(); });
})();
</script>
